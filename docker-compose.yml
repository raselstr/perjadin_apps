services:

  db:
    image: postgres:14
    container_name: perjadin_apps_postgres_db
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB_FILE: /run/secrets/db_name
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_name
      - db_user
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - perjadinapps_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_user) -d $(cat /run/secrets/db_name)"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: perjadin_apps
    restart: always
    volumes:
    - ./staticfiles:/app/staticfiles
    secrets:
      - db_name
      - db_user
      - db_password
      - secret_key
    environment:
      DB_HOST: perjadin_apps_postgres_db
      DB_PORT: 5432
      DEBUG: "False"
      # =========================
      # HTTP / HTTPS
      # =========================
      # HTTP:
      # USE_HTTPS: "False"
      # SECURE_SSL_REDIRECT: "False"
      #
      # HTTPS:
      # USE_HTTPS: "True"
      # SECURE_SSL_REDIRECT: "True"
      # SECURE_HSTS_SECONDS: "31536000"
      # ALLOWED_HOSTS: "domain.go.id,www.domain.go.id"
      # CSRF_TRUSTED_ORIGINS: "https://domain.go.id,https://www.domain.go.id"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - perjadinapps_network

  nginx:
    image: nginx:latest
    container_name: perjadin_apps_nginx_server
    restart: always
    ports:
      - "8085:80"
      # Aktifkan saat HTTPS digunakan:
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles   # 🔥 INI DI SINI
      - ./media:/app/media               # optional
      # Aktifkan saat HTTPS digunakan dengan Let's Encrypt host:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - perjadinapps_network

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: perjadin_apps_cloudbeaver
    restart: always
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      db:
        condition: service_healthy
    networks:
      - perjadinapps_network

networks:
  perjadinapps_network:

secrets:
  db_name:
    file: ./secrets/db_name.txt
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  secret_key:
    file: ./secrets/secret_key.txt

volumes:
  postgres_data:
  cloudbeaver_data:
  static_volume:
  media_volume:
