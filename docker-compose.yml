services:

  web:
    build: .

    container_name: perjadin_apps
    expose:
      - "8001"

    restart: always

    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media

    secrets:
      - db_name
      - db_user
      - db_password
      - secret_key

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

      DEBUG: "False"

      USE_HTTPS: "False"
      SECURE_SSL_REDIRECT: "False"

      ALLOWED_HOSTS: "*"

    networks:
      - production_network

networks:
  production_network:
    external: true

secrets:
  db_name:
    file: ./secrets/db_name.txt

  db_user:
    file: ./secrets/db_user.txt

  db_password:
    file: ./secrets/db_password.txt

  secret_key:
    file: ./secrets/secret_key.txt