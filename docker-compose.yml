services:

  web:
    build: .

    container_name: perjadin_apps
    expose:
      - "80"
      - "8085"
    
    ports:
      - "8085:80"

    restart: always

    volumes:
      - ./:/app
      - ./entrypoint.sh:/entrypoint.sh
      - perjadin_static:/app/staticfiles
      - perjadin_media:/app/media

    secrets:
      - db_name
      - db_user
      - db_password
      - secret_key

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

      DEBUG: "False"

      USE_HTTPS: "False"
      SECURE_SSL_REDIRECT: "False"

      ALLOWED_HOSTS: "103.188.249.54,perjadin.bkadasahan.dedyn.io,perjadin.bkadasahan.ddns.net,192.168.66.5,192.168.66.167,127.0.0.1,localhost,perjadin_apps,web"
      CSRF_TRUSTED_ORIGINS: "http://103.188.249.54:8085,http://perjadin.bkadasahan.dedyn.io:8085,https://perjadin.bkadasahan.dedyn.io,http://perjadin.bkadasahan.ddns.net:8085,https://perjadin.bkadasahan.ddns.net,http://192.168.66.5:8085,http://192.168.66.167:8085,http://localhost:8085,http://127.0.0.1:8085"

    networks:
      - production_network

volumes:
  perjadin_static:
    name: perjadin_static

  perjadin_media:
    name: perjadin_media

networks:
  production_network:
    external: true

secrets:
  db_name:
    file: ./secrets/db_name.txt

  db_user:
    file: ./secrets/db_user.txt

  db_password:
    file: ./secrets/db_password.txt

  secret_key:
    file: ./secrets/secret_key.txt