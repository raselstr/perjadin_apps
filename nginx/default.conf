server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # =========================
    # MODE HTTPS
    # =========================
    # Aktifkan redirect ini hanya setelah sertifikat HTTPS siap.
    # Ganti server_name _; dengan domain resmi, misalnya:
    #   server_name domain.go.id www.domain.go.id;
    #
    # Perintah sertifikat Let's Encrypt pada host:
    #   sudo apt update
    #   sudo apt install -y certbot python3-certbot-nginx
    #   sudo certbot --nginx -d domain.go.id -d www.domain.go.id
    #   sudo certbot renew --dry-run
    #
    # Jika memakai Docker nginx, mount folder sertifikat:
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
    #
    # Setelah HTTPS aktif, buka port 443 di docker-compose/firewall dan set:
    #   USE_HTTPS=True
    #   SECURE_SSL_REDIRECT=True
    #   CSRF_TRUSTED_ORIGINS=https://domain.go.id,https://www.domain.go.id
    #
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://web:8000;
        proxy_redirect off;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /app/media/;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy same-origin;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
}

