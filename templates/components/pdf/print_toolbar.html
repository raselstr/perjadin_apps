<div
    class="toolbar"
    data-print-toolbar
    data-document-type="{{ document_type|default:'document' }}"
    data-default-scale="{{ kop_surat.print_scale_percent|default:100 }}">
    <div class="scale-control">
        <label for="print-scale">Zoom</label>
        <button type="button" class="scale-step" data-scale-step="-1">-</button>
        <input
            id="print-scale"
            type="range"
            min="75"
            max="120"
            step="1"
            value="{{ kop_surat.print_scale_percent|default:100 }}"
            aria-label="Zoom tampilan cetak">
        <button type="button" class="scale-step" data-scale-step="1">+</button>
        <output for="print-scale">{{ kop_surat.print_scale_percent|default:100 }}%</output>
    </div>
    <a href="javascript:window.close()">Tutup</a>
    <button type="button" onclick="window.print()">Cetak PDF</button>
</div>

<script>
(function () {
    const toolbar = document.querySelector("[data-print-toolbar]");

    if (!toolbar) {
        return;
    }

    const input = toolbar.querySelector("#print-scale");
    const output = toolbar.querySelector("output");
    const stepButtons = toolbar.querySelectorAll("[data-scale-step]");
    const documentType = toolbar.dataset.documentType || "document";
    const storageKey = `pdfPrintScale:${documentType}`;
    const defaultScale = Number(toolbar.dataset.defaultScale || 100);

    function clampScale(value) {
        const numericValue = Number(value || defaultScale);
        return Math.min(120, Math.max(75, numericValue));
    }

    function getStoredScale() {
        try {
            return window.localStorage.getItem(storageKey);
        } catch (error) {
            return null;
        }
    }

    function setStoredScale(value) {
        try {
            window.localStorage.setItem(storageKey, String(value));
        } catch (error) {
            return;
        }
    }

    function applyScale(value) {
        const scaleValue = clampScale(value);
        const scaleRatio = scaleValue / 100;

        document.documentElement.style.setProperty("--preview-scale", scaleRatio);
        document.documentElement.style.setProperty("--print-scale", scaleRatio);

        if (input) {
            input.value = scaleValue;
        }

        if (output) {
            output.textContent = `${scaleValue}%`;
        }

        setStoredScale(scaleValue);
    }

    if (input) {
        input.addEventListener("input", function () {
            applyScale(input.value);
        });
    }

    stepButtons.forEach(function (button) {
        button.addEventListener("click", function () {
            const currentValue = input ? input.value : defaultScale;
            const nextValue = clampScale(
                Number(currentValue) + Number(button.dataset.scaleStep || 0)
            );
            applyScale(nextValue);
        });
    });

    applyScale(getStoredScale() || defaultScale);
})();
</script>
