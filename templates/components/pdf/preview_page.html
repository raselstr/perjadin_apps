<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* ========= Tema Visual Hijau Zamrud (Emerald) + Emas + Merah ========= */
    :root {
      --emerald-50:  #ECFDF5;
      --emerald-100: #D1FAE5;
      --emerald-200: #A7F3D0;
      --emerald-500: #10B981;
      --emerald-600: #059669;
      --emerald-700: #047857;
      --emerald-800: #065F46;
      --emerald-900: #064E3B;
      --emerald-950: #022c22;
      --gold-500: #F59E0B;
      --gold-600: #D97706;
      --gold-700: #B45309;
      --ruby-600: #DC2626;
      --ruby-700: #B91C1C;
    }

    body {
      /* Latar Hijau Zamrud Elegan konsisten dengan tema 3D aplikasi */
      background-color: var(--emerald-50);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(5, 150, 105, 0.20) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.16) 0%, transparent 50%),
        linear-gradient(145deg, #F0FDF4 0%, #ECFDF5 55%, #D1FAE5 100%);
      color: var(--emerald-950);
    }

    .preview-layout {
      min-height: 100vh;
      padding: 16px;
    }

    /* Toolbar: kartu putih melayang dengan efek 3D Zamrud */
    .preview-toolbar {
      background: #FFFFFF;
      border: 1px solid rgba(5, 150, 105, 0.25);
      border-top: 3px solid var(--emerald-600);
      border-radius: 14px;
      margin: 0 auto 12px;
      max-width: 1180px;
      padding: 18px;
      box-shadow:
        0 4px 6px -1px rgba(6, 78, 59, 0.07),
        0 12px 24px -3px rgba(6, 78, 59, 0.12),
        inset 0 1px 0 #FFFFFF;
    }

    /* Judul halaman (h1) */
    .preview-toolbar h1 {
      color: var(--emerald-950) !important;
      font-weight: 700 !important;
    }

    /* Teks deskripsi "Tinjau SPT terlebih dahulu sebelum dicetak." 
       — WARNA HIJAU ZAMRUD GELAP & SANGAT JELAS */
    .preview-toolbar .text-muted,
    .preview-toolbar [class*="text-muted"] {
      color: var(--emerald-900) !important;
      font-weight: 700 !important;
      font-size: 0.95rem !important;
    }

    /* Label-label form di dalam toolbar */
    .preview-toolbar .form-label,
    .preview-toolbar label {
      color: var(--emerald-950) !important;
      font-weight: 600 !important;
    }

    /* Teks informasi skala/margin yang small */
    .preview-toolbar .small,
    .preview-toolbar small {
      color: #334155 !important;
    }

    /* text-dark di dalam toolbar */
    .preview-toolbar .text-dark,
    .preview-toolbar [class*="text-dark"] {
      color: var(--emerald-950) !important;
      font-weight: 700 !important;
    }

    /* fw-semibold heading dalam toolbar */
    .preview-toolbar .fw-semibold {
      color: var(--emerald-950) !important;
    }

    /* ---- TOMBOL CETAK (KUNING EMAS 3D — TEKS HIJAU ZAMRUD GELAP SANGAT TERBACA) ---- */
    .btn-primary {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%) !important;
      border: none !important;
      color: #022c22 !important; /* Teks hijau zamrud gelap kontras tinggi */
      font-weight: 700 !important;
      border-radius: 10px !important;
      padding: 0.55rem 1.4rem !important;
      box-shadow:
        0 4px 0 #92400E,
        0 8px 16px rgba(217, 119, 6, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.7) !important;
      transition: all 0.15s ease !important;
    }

    .btn-primary:hover {
      background: linear-gradient(180deg, #FBBF24 0%, #F59E0B 100%) !important;
      color: #000000 !important;
      transform: translateY(-2px) !important;
      box-shadow:
        0 6px 0 #92400E,
        0 12px 20px rgba(217, 119, 6, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.85) !important;
    }

    .btn-primary:active {
      transform: translateY(2px) !important;
      box-shadow:
        0 1px 0 #92400E,
        0 2px 6px rgba(217, 119, 6, 0.3),
        inset 0 2px 4px rgba(0, 0, 0, 0.18) !important;
    }

    /* ---- TOMBOL OUTLINE SECONDARY (HIJAU ZAMRUD SUBTLE) ---- */
    .btn-outline-secondary {
      color: var(--emerald-800) !important;
      border: 1.5px solid rgba(5, 150, 105, 0.6) !important;
      background: #FFFFFF !important;
      font-weight: 600 !important;
      border-radius: 10px !important;
      box-shadow: 0 2px 5px rgba(6, 78, 59, 0.08), inset 0 1px 0 #FFFFFF !important;
      transition: all 0.15s ease !important;
    }

    .btn-outline-secondary:hover {
      background: var(--emerald-100) !important;
      color: var(--emerald-950) !important;
      border-color: var(--emerald-600) !important;
    }

    .btn-outline-secondary:hover {
      background: var(--green-light-200) !important;
      border-color: var(--green-light-500) !important;
      color: var(--green-deep-950) !important;
      transform: translateY(-1px);
    }

    /* ---- TOMBOL OUTLINE SECONDARY KECIL (btn-sm) ---- */
    .btn-sm {
      padding: 0.3rem 0.7rem !important;
      font-size: 0.82rem !important;
      border-radius: 8px !important;
    }

    /* ---- TOOLBAR SKALA/MARGIN (KUNING PUCAT HANGAT) ---- */
    .print-scale-toolbar {
      background: #FFFDE7;
      border: 1px solid rgba(255, 193, 7, 0.45);
      border-radius: 10px;
      margin-top: 14px;
      padding: 14px;
      color: var(--green-deep-950);
    }

    .print-scale-toolbar .form-range {
      accent-color: var(--gold-700);
    }

    /* ---- INPUT FORM ---- */
    .form-control {
      background-color: #FFFFFF !important;
      border: 1.5px solid #CBD5E1 !important;
      border-radius: 8px !important;
      color: #0F172A !important;
      box-shadow: inset 0 1px 3px rgba(46, 125, 50, 0.05) !important;
    }

    .form-control:focus {
      border-color: var(--green-light-500) !important;
      box-shadow: inset 0 1px 2px rgba(46, 125, 50, 0.08), 0 0 0 3px rgba(139, 195, 74, 0.2) !important;
      outline: none !important;
    }

    .input-group-text {
      background: linear-gradient(180deg, #F1F8E9 0%, #DCEDC8 100%) !important;
      border-color: #CBD5E1 !important;
      color: var(--green-deep-900) !important;
      font-weight: 600 !important;
    }

    /* ---- FRAME SHELL ---- */
    .preview-frame-shell {
      background: #FFFFFF;
      border: 1px solid rgba(139, 195, 74, 0.25);
      border-radius: 14px;
      margin: 0 auto;
      max-width: 1180px;
      overflow: hidden;
      box-shadow:
        0 2px 4px rgba(46, 125, 50, 0.04),
        0 8px 18px -2px rgba(46, 125, 50, 0.10);
    }

    .print-preview-frame {
      background: #F4FAF4;
      border: 0;
      display: block;
      height: calc(100vh - 330px);
      min-height: 520px;
      width: 100%;
    }

    @media (max-width: 768px) {
      .preview-layout {
        padding: 8px;
      }
      .print-preview-frame {
        height: calc(100vh - 430px);
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <main class="preview-layout">
    <section class="preview-toolbar">
      <div class="d-flex flex-column flex-lg-row gap-2 justify-content-between">
        <div>
          <h1 class="h5 mb-1">{{ title }}</h1>
          <div class="text-muted small">{{ preview_description }}</div>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button
            type="button"
            class="btn btn-primary"
            data-print-preview-action="print"
            data-frame-id="{{ frame_id }}">
            {{ print_button_label }}
          </button>
          <a href="{{ open_url }}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-secondary">
            Buka Dokumen
          </a>
        </div>
      </div>

      <div
        class="print-scale-toolbar"
        data-print-scale-toolbar
        data-frame-id="{{ frame_id }}"
        role="status">
        <div class="fw-semibold mb-1">Skala dan margin cetak</div>

        <div class="row g-2 align-items-center">
          <div class="col-12 col-lg-auto">
            <label class="form-label mb-0" for="{{ frame_id }}-scale-range">Skala dokumen</label>
          </div>
          <div class="col-12 col-lg">
            <input id="{{ frame_id }}-scale-range" class="form-range mb-0" type="range" min="75" max="120" step="1" value="100" data-print-scale-range>
          </div>
          <div class="col-8 col-sm-4 col-lg-2">
            <div class="input-group input-group-sm">
              <input class="form-control" type="number" min="75" max="120" step="1" value="100" inputmode="numeric" data-print-scale-input>
              <span class="input-group-text">%</span>
            </div>
          </div>
          <div class="col-4 col-sm-3 col-lg-auto">
            <button type="button" class="btn btn-sm btn-outline-secondary w-100" data-print-scale-reset>Reset</button>
          </div>
        </div>

        <div class="small text-muted mt-2">
          Default dokumen:
          <span class="fw-semibold" data-print-scale-default-label>100%</span>
        </div>
        <div class="small mt-1">
          Skala aktif:
          <span class="fw-semibold text-dark" data-print-scale-current-label>100%</span>
          <span class="text-muted" data-print-scale-state-label>(default)</span>
        </div>

        <div class="fw-semibold mt-3 mb-1">Margin cetak</div>
        <div class="row g-2">
          <div class="col-6 col-lg-3">
            <label class="form-label mb-1" for="{{ frame_id }}-margin-top">Atas</label>
            <div class="input-group input-group-sm">
              <input id="{{ frame_id }}-margin-top" class="form-control" type="number" min="0" max="50" step="0.5" value="18" inputmode="decimal" data-print-margin-input="top">
              <span class="input-group-text">mm</span>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <label class="form-label mb-1" for="{{ frame_id }}-margin-right">Kanan</label>
            <div class="input-group input-group-sm">
              <input id="{{ frame_id }}-margin-right" class="form-control" type="number" min="0" max="50" step="0.5" value="18" inputmode="decimal" data-print-margin-input="right">
              <span class="input-group-text">mm</span>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <label class="form-label mb-1" for="{{ frame_id }}-margin-bottom">Bawah</label>
            <div class="input-group input-group-sm">
              <input id="{{ frame_id }}-margin-bottom" class="form-control" type="number" min="0" max="50" step="0.5" value="20" inputmode="decimal" data-print-margin-input="bottom">
              <span class="input-group-text">mm</span>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <label class="form-label mb-1" for="{{ frame_id }}-margin-left">Kiri</label>
            <div class="input-group input-group-sm">
              <input id="{{ frame_id }}-margin-left" class="form-control" type="number" min="0" max="50" step="0.5" value="18" inputmode="decimal" data-print-margin-input="left">
              <span class="input-group-text">mm</span>
            </div>
          </div>
        </div>
        <div class="mt-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-print-margin-reset>Reset margin</button>
        </div>
        <div class="small text-muted mt-2">
          Default margin:
          <span class="fw-semibold" data-print-margin-default-label>Atas 18 | Kanan 18 | Bawah 20 | Kiri 18 mm</span>
        </div>
        <div class="small mt-1">
          Margin aktif:
          <span class="fw-semibold text-dark" data-print-margin-current-label>Atas 18 | Kanan 18 | Bawah 20 | Kiri 18 mm</span>
          <span class="text-muted" data-print-margin-state-label>(default)</span>
        </div>
      </div>
    </section>

    <section class="preview-frame-shell">
      <iframe
        id="{{ frame_id }}"
        class="print-preview-frame"
        src="{{ iframe_src }}"
        title="{{ title }}">
      </iframe>
    </section>
  </main>

  <script>
    function notifyPreview(message) {
      window.alert(message);
    }

    function printPreviewFrame(frameId) {
      const frame = document.getElementById(frameId);
      const frameWindow = frame?.contentWindow;
      if (!frameWindow) {
        notifyPreview('Dokumen masih dimuat. Coba cetak beberapa saat lagi.');
        return;
      }
      frameWindow.focus();
      frameWindow.print();
    }

    function clampPrintScalePercent(value, fallback = 100) {
      const numericValue = Number(value);
      if (!Number.isFinite(numericValue)) {
        return fallback;
      }
      return Math.min(120, Math.max(75, Math.round(numericValue)));
    }

    function toPrintScaleDecimal(scalePercent) {
      return (scalePercent / 100).toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    }

    function clampPrintMarginMm(value, fallback = 0) {
      const numericValue = Number(value);
      if (!Number.isFinite(numericValue)) {
        return fallback;
      }
      return Math.min(50, Math.max(0, Math.round(numericValue * 10) / 10));
    }

    function formatPrintMarginMm(value) {
      return String(clampPrintMarginMm(value)).replace(/\.0$/, '');
    }

    function normalizePrintMargins(margins = {}, fallback = {}) {
      const normalizedFallback = {
        top: clampPrintMarginMm(fallback.top, 18),
        right: clampPrintMarginMm(fallback.right, 18),
        bottom: clampPrintMarginMm(fallback.bottom, 20),
        left: clampPrintMarginMm(fallback.left, 18),
      };
      return {
        top: clampPrintMarginMm(margins.top, normalizedFallback.top),
        right: clampPrintMarginMm(margins.right, normalizedFallback.right),
        bottom: clampPrintMarginMm(margins.bottom, normalizedFallback.bottom),
        left: clampPrintMarginMm(margins.left, normalizedFallback.left),
      };
    }

    function serializePrintMargins(margins) {
      const normalizedMargins = normalizePrintMargins(margins);
      return [
        formatPrintMarginMm(normalizedMargins.top),
        formatPrintMarginMm(normalizedMargins.right),
        formatPrintMarginMm(normalizedMargins.bottom),
        formatPrintMarginMm(normalizedMargins.left),
      ].join('|');
    }

    function parsePrintMargins(value, fallback = {}) {
      if (!value) {
        return normalizePrintMargins({}, fallback);
      }
      const [top, right, bottom, left] = String(value).split('|');
      return normalizePrintMargins({ top, right, bottom, left }, fallback);
    }

    function formatPrintMarginsLabel(margins) {
      const normalizedMargins = normalizePrintMargins(margins);
      return [
        `Atas ${formatPrintMarginMm(normalizedMargins.top)}`,
        `Kanan ${formatPrintMarginMm(normalizedMargins.right)}`,
        `Bawah ${formatPrintMarginMm(normalizedMargins.bottom)}`,
        `Kiri ${formatPrintMarginMm(normalizedMargins.left)} mm`,
      ].join(' | ');
    }

    function getPrintScaleToolbar(frameId) {
      return document.querySelector(`[data-print-scale-toolbar][data-frame-id="${frameId}"]`);
    }

    function getPrintPreviewDocument(frameId) {
      const frame = document.getElementById(frameId);
      return frame?.contentDocument || null;
    }

    function isPrintPreviewLoaded(frameId) {
      const previewDocument = getPrintPreviewDocument(frameId);
      const previewLocation = previewDocument?.location?.href || '';
      return Boolean(previewDocument?.body && previewLocation && previewLocation !== 'about:blank');
    }

    function getPreviewScalePercent(frameId, fallback = 100) {
      const previewDocument = getPrintPreviewDocument(frameId);
      if (!previewDocument) {
        return fallback;
      }
      const datasetScale = previewDocument.body?.dataset.currentScalePercent;
      if (datasetScale) {
        return clampPrintScalePercent(datasetScale, fallback);
      }
      const scaleValue = previewDocument.defaultView
        ?.getComputedStyle(previewDocument.documentElement)
        ?.getPropertyValue('--content-scale')
        ?.trim()
        ?.replace(/['"]/g, '');
      const numericScale = Number(scaleValue);
      if (Number.isFinite(numericScale) && numericScale > 0) {
        return clampPrintScalePercent(numericScale * 100, fallback);
      }
      return fallback;
    }

    function getPreviewMargins(frameId, fallback = {}) {
      const previewDocument = getPrintPreviewDocument(frameId);
      const normalizedFallback = normalizePrintMargins({}, fallback);
      if (!previewDocument) {
        return normalizedFallback;
      }
      const previewStyles = previewDocument.defaultView
        ?.getComputedStyle(previewDocument.documentElement);
      return normalizePrintMargins({
        top: previewStyles?.getPropertyValue('--document-margin-top')?.trim()?.replace(/mm$/i, ''),
        right: previewStyles?.getPropertyValue('--document-margin-right')?.trim()?.replace(/mm$/i, ''),
        bottom: previewStyles?.getPropertyValue('--document-margin-bottom')?.trim()?.replace(/mm$/i, ''),
        left: previewStyles?.getPropertyValue('--document-margin-left')?.trim()?.replace(/mm$/i, ''),
      }, normalizedFallback);
    }

    function applyPrintScaleToPreview(frameId, scalePercent, options = {}) {
      const previewDocument = getPrintPreviewDocument(frameId);
      if (!previewDocument?.documentElement || !previewDocument?.body) {
        return false;
      }
      const normalizedScale = clampPrintScalePercent(scalePercent);
      previewDocument.documentElement.style.setProperty('--content-scale', toPrintScaleDecimal(normalizedScale));
      previewDocument.body.dataset.currentScalePercent = String(normalizedScale);
      if (options.forcePrintScale) {
        previewDocument.body.dataset.forcePrintScale = 'true';
      } else {
        delete previewDocument.body.dataset.forcePrintScale;
      }
      return true;
    }

    function applyPrintMarginsToPreview(frameId, margins, options = {}) {
      const previewDocument = getPrintPreviewDocument(frameId);
      if (!previewDocument?.documentElement || !previewDocument?.body) {
        return false;
      }
      const normalizedMargins = normalizePrintMargins(margins);
      previewDocument.documentElement.style.setProperty('--document-margin-top', `${formatPrintMarginMm(normalizedMargins.top)}mm`);
      previewDocument.documentElement.style.setProperty('--document-margin-right', `${formatPrintMarginMm(normalizedMargins.right)}mm`);
      previewDocument.documentElement.style.setProperty('--document-margin-bottom', `${formatPrintMarginMm(normalizedMargins.bottom)}mm`);
      previewDocument.documentElement.style.setProperty('--document-margin-left', `${formatPrintMarginMm(normalizedMargins.left)}mm`);
      if (options.forcePrintMargins) {
        previewDocument.body.dataset.forcePrintMargins = 'true';
      } else {
        delete previewDocument.body.dataset.forcePrintMargins;
      }
      return true;
    }

    function syncPrintScaleToolbar(toolbar, scalePercent) {
      const normalizedScale = clampPrintScalePercent(scalePercent);
      const defaultScale = clampPrintScalePercent(toolbar.dataset.defaultScalePercent, normalizedScale);
      toolbar.querySelector('[data-print-scale-range]').value = String(normalizedScale);
      toolbar.querySelector('[data-print-scale-input]').value = String(normalizedScale);
      toolbar.querySelector('[data-print-scale-default-label]').textContent = `${defaultScale}%`;
      toolbar.querySelector('[data-print-scale-current-label]').textContent = `${normalizedScale}%`;
      toolbar.querySelector('[data-print-scale-state-label]').textContent = normalizedScale === defaultScale ? '(default)' : '(disesuaikan)';
    }

    function syncPrintMarginToolbar(toolbar, margins) {
      const normalizedMargins = normalizePrintMargins(margins);
      const defaultMargins = parsePrintMargins(toolbar.dataset.defaultMargins, normalizedMargins);
      ['top', 'right', 'bottom', 'left'].forEach(function (side) {
        toolbar.querySelector(`[data-print-margin-input="${side}"]`).value = formatPrintMarginMm(normalizedMargins[side]);
      });
      toolbar.querySelector('[data-print-margin-default-label]').textContent = formatPrintMarginsLabel(defaultMargins);
      toolbar.querySelector('[data-print-margin-current-label]').textContent = formatPrintMarginsLabel(normalizedMargins);
      toolbar.querySelector('[data-print-margin-state-label]').textContent = serializePrintMargins(normalizedMargins) === serializePrintMargins(defaultMargins)
        ? '(default)'
        : '(disesuaikan)';
    }

    function initializePrintScaleToolbar(container) {
      const toolbar = container?.querySelector('[data-print-scale-toolbar]');
      if (!toolbar) {
        return;
      }
      const frameId = toolbar.dataset.frameId;
      const frame = document.getElementById(frameId);
      if (!frame) {
        return;
      }
      const syncFromPreview = () => {
        const currentScale = getPreviewScalePercent(frameId);
        const currentMargins = getPreviewMargins(frameId);
        if (isPrintPreviewLoaded(frameId)) {
          toolbar.dataset.defaultScalePercent = String(currentScale);
          toolbar.dataset.defaultMargins = serializePrintMargins(currentMargins);
        }
        syncPrintScaleToolbar(toolbar, currentScale);
        syncPrintMarginToolbar(toolbar, currentMargins);
        applyPrintScaleToPreview(frameId, currentScale, { forcePrintScale: true });
        applyPrintMarginsToPreview(frameId, currentMargins, { forcePrintMargins: true });
      };
      frame.addEventListener('load', syncFromPreview);
      syncFromPreview();
    }

    document.addEventListener('click', function (evt) {
      const resetMarginButton = evt.target.closest('[data-print-margin-reset]');
      if (resetMarginButton) {
        const toolbar = resetMarginButton.closest('[data-print-scale-toolbar]');
        const frameId = toolbar.dataset.frameId;
        const defaultMargins = parsePrintMargins(toolbar.dataset.defaultMargins);
        syncPrintMarginToolbar(toolbar, defaultMargins);
        applyPrintMarginsToPreview(frameId, defaultMargins, { forcePrintMargins: true });
        return;
      }
      const resetScaleButton = evt.target.closest('[data-print-scale-reset]');
      if (resetScaleButton) {
        const toolbar = resetScaleButton.closest('[data-print-scale-toolbar]');
        const frameId = toolbar.dataset.frameId;
        const defaultScale = clampPrintScalePercent(toolbar.dataset.defaultScalePercent, 100);
        syncPrintScaleToolbar(toolbar, defaultScale);
        applyPrintScaleToPreview(frameId, defaultScale, { forcePrintScale: true });
        return;
      }
      const printButton = evt.target.closest('[data-print-preview-action="print"]');
      if (!printButton) {
        return;
      }
      const frameId = printButton.dataset.frameId;
      const toolbar = getPrintScaleToolbar(frameId);
      const scalePercent = clampPrintScalePercent(toolbar.querySelector('[data-print-scale-input]')?.value, getPreviewScalePercent(frameId));
      const marginValues = normalizePrintMargins({
        top: toolbar.querySelector('[data-print-margin-input="top"]')?.value,
        right: toolbar.querySelector('[data-print-margin-input="right"]')?.value,
        bottom: toolbar.querySelector('[data-print-margin-input="bottom"]')?.value,
        left: toolbar.querySelector('[data-print-margin-input="left"]')?.value,
      }, getPreviewMargins(frameId));
      applyPrintScaleToPreview(frameId, scalePercent, { forcePrintScale: true });
      applyPrintMarginsToPreview(frameId, marginValues, { forcePrintMargins: true });
      printPreviewFrame(frameId);
    });

    document.addEventListener('input', function (evt) {
      const scaleInput = evt.target.closest('[data-print-scale-range], [data-print-scale-input]');
      if (!scaleInput) {
        const marginInput = evt.target.closest('[data-print-margin-input]');
        if (!marginInput) {
          return;
        }
        const toolbar = marginInput.closest('[data-print-scale-toolbar]');
        const frameId = toolbar.dataset.frameId;
        const nextMargins = normalizePrintMargins({
          top: toolbar.querySelector('[data-print-margin-input="top"]')?.value,
          right: toolbar.querySelector('[data-print-margin-input="right"]')?.value,
          bottom: toolbar.querySelector('[data-print-margin-input="bottom"]')?.value,
          left: toolbar.querySelector('[data-print-margin-input="left"]')?.value,
        }, getPreviewMargins(frameId));
        syncPrintMarginToolbar(toolbar, nextMargins);
        applyPrintMarginsToPreview(frameId, nextMargins, { forcePrintMargins: true });
        return;
      }
      const toolbar = scaleInput.closest('[data-print-scale-toolbar]');
      const frameId = toolbar.dataset.frameId;
      const nextScale = clampPrintScalePercent(scaleInput.value, getPreviewScalePercent(frameId));
      syncPrintScaleToolbar(toolbar, nextScale);
      applyPrintScaleToPreview(frameId, nextScale, { forcePrintScale: true });
    });

    document.addEventListener('DOMContentLoaded', function () {
      initializePrintScaleToolbar(document);
    });
  </script>
</body>
</html>
