<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  const sptField = scope.querySelector('[data-spj-spt-field="1"]');
  const pelaksanaField = scope.querySelector('[data-spj-pelaksana-field="1"]');
  const jenisSpjField = scope.querySelector('[data-spj-jenis-spj-field="1"]');
  if (!pelaksanaField || pelaksanaField.dataset.spjHtmxBindingReady) {
    return;
  }
  pelaksanaField.dataset.spjHtmxBindingReady = '1';

  function refreshSelect2Field(field) {
    if (!window.jQuery || !window.jQuery.fn.select2) {
      field.dispatchEvent(new Event('change', { bubbles: true }));
      return;
    }

    const $field = window.jQuery(field);
    const $dropdownParent = $field.closest('[data-formset-row], .modal');
    if ($field.hasClass('select2-hidden-accessible')) {
      $field.select2('destroy');
    }
    $field.select2({
      width: '100%',
      dropdownParent: $dropdownParent.length ? $dropdownParent : window.jQuery(document.body),
      theme: 'bootstrap-5'
    });
    $field.trigger('change');
  }

  document.body.addEventListener('htmx:afterSwap', function (event) {
    if (event.detail.target !== pelaksanaField) {
      return;
    }
    refreshSelect2Field(pelaksanaField);
  });

  if (window.jQuery && window.jQuery.fn.select2 && window.htmx && sptField) {
    window.jQuery(sptField).on('select2:select select2:clear', function () {
      window.htmx.trigger(sptField, 'change');
    });
    if (jenisSpjField) {
      window.jQuery(jenisSpjField).on('select2:select select2:clear', function () {
        window.htmx.trigger(sptField, 'change');
      });
    }
  }
})();
</script>
<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  const sptField = scope.querySelector('[data-spj-calculation-url]');
  const pelaksanaField = scope.querySelector('[data-spj-pelaksana-field="1"]');
  if (!sptField || !pelaksanaField || sptField.dataset.calculationReady) {
    return;
  }
  sptField.dataset.calculationReady = '1';

  function setCalculatedValue(name, value) {
    const field = scope.querySelector('[data-spj-calculation-field="' + name + '"]');
    if (field) {
      field.value = value || '';
    }
  }

  function loadCalculation() {
    const url = sptField.dataset.spjCalculationUrl;
    const kind = sptField.dataset.spjCalculationKind;
    if (!url || !kind || !sptField.value || !pelaksanaField.value) {
      setCalculatedValue('nilai', '');
      setCalculatedValue('total', '');
      return;
    }

    const params = new URLSearchParams({
      jenis: kind,
      spt: sptField.value,
      pelaksana: pelaksanaField.value,
    });
    fetch(url + '?' + params.toString(), {
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        setCalculatedValue('nilai', data.nilai);
        setCalculatedValue('total', data.total);
      })
      .catch(function () {});
  }

  sptField.addEventListener('change', function () {
    setTimeout(loadCalculation, 300);
  });
  pelaksanaField.addEventListener('change', loadCalculation);
  if (window.jQuery && window.jQuery.fn.select2) {
    window.jQuery(pelaksanaField).on('select2:select', loadCalculation);
  }
  loadCalculation();
})();
</script>
<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  scope.querySelectorAll('[data-spj-rich-editor="1"]').forEach(function (textarea) {
    if (textarea.dataset.richReady) {
      return;
    }
    textarea.dataset.richReady = '1';

    const wrapper = document.createElement('div');
    wrapper.className = 'spj-rich-editor border rounded';
    const toolbar = document.createElement('div');
    toolbar.className = 'd-flex flex-wrap gap-1 border-bottom bg-light p-2';
    const editor = document.createElement('div');
    editor.className = 'p-2';
    editor.contentEditable = 'true';
    editor.style.minHeight = '150px';
    editor.style.outline = 'none';
    editor.innerHTML = textarea.value || '';

    function addButton(label, command, value) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn btn-sm btn-outline-secondary';
      button.textContent = label;
      button.addEventListener('click', function () {
        editor.focus();
        document.execCommand(command, false, value || null);
        textarea.value = editor.innerHTML;
      });
      toolbar.appendChild(button);
    }

    function addSelect(options, command) {
      const select = document.createElement('select');
      select.className = 'form-select form-select-sm';
      select.style.width = 'auto';
      options.forEach(function (item) {
        const option = document.createElement('option');
        option.value = item.value;
        option.textContent = item.label;
        select.appendChild(option);
      });
      select.addEventListener('change', function () {
        editor.focus();
        document.execCommand(command, false, select.value);
        textarea.value = editor.innerHTML;
      });
      toolbar.appendChild(select);
    }

    addSelect([
      { label: 'Paragraf', value: 'p' },
      { label: 'Judul 1', value: 'h1' },
      { label: 'Judul 2', value: 'h2' },
      { label: 'Judul 3', value: 'h3' },
    ], 'formatBlock');
    addSelect([
      { label: 'Arial', value: 'Arial' },
      { label: 'Times New Roman', value: 'Times New Roman' },
      { label: 'Calibri', value: 'Calibri' },
    ], 'fontName');
    addSelect([
      { label: 'Normal', value: '3' },
      { label: 'Kecil', value: '2' },
      { label: 'Besar', value: '4' },
      { label: 'Sangat Besar', value: '5' },
    ], 'fontSize');
    addButton('B', 'bold');
    addButton('I', 'italic');
    addButton('U', 'underline');
    addButton('Bullet', 'insertUnorderedList');
    addButton('Numbering', 'insertOrderedList');
    addButton('Tab', 'insertHTML', '&emsp;');

    editor.addEventListener('input', function () {
      textarea.value = editor.innerHTML;
    });
    textarea.form?.addEventListener('submit', function () {
      textarea.value = editor.innerHTML;
    });

    textarea.classList.add('d-none');
    textarea.parentNode.insertBefore(wrapper, textarea);
    wrapper.appendChild(toolbar);
    wrapper.appendChild(editor);
  });
})();
</script>

<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  function initializeGeoMap() {
    const geoForm = scope.querySelector('[data-spj-geo-form="1"]');
    if (!geoForm || geoForm.dataset.geoReady) {
      return;
    }
    geoForm.dataset.geoReady = '1';

    const mapFrame = geoForm.querySelector('[data-spj-geo-map="1"]');
    const searchInput = geoForm.querySelector('[data-spj-geo-search="1"]');
    const searchButton = geoForm.querySelector('[data-spj-geo-search-button="1"]');
    const currentButton = geoForm.querySelector('[data-spj-geo-current-button="1"]');
    const statusElement = geoForm.querySelector('[data-spj-geo-status="1"]');
    const mapButton = geoForm.querySelector('[data-spj-geo-map-button="1"]');
    const latitudeField = document.getElementById(geoForm.dataset.latField);
    const longitudeField = document.getElementById(geoForm.dataset.lngField);
    if (!mapFrame || !latitudeField || !longitudeField) {
      return;
    }

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    const defaultPoint = [-2.548926, 118.0148634];
    const initialLatitude = parseFloat(latitudeField.value);
    const initialLongitude = parseFloat(longitudeField.value);
    const hasInitialPoint = !Number.isNaN(initialLatitude) && !Number.isNaN(initialLongitude);
    const startPoint = hasInitialPoint ? [initialLatitude, initialLongitude] : defaultPoint;

    if (isMobile) {
      mapFrame.classList.add('d-none');
      if (mapButton) {
        mapButton.classList.remove('d-none');
      }
    }

    function setStatus(message, tone) {
      if (!statusElement) {
        return;
      }
      statusElement.textContent = message || '';
      statusElement.classList.toggle('text-danger', tone === 'danger');
      statusElement.classList.toggle('text-success', tone === 'success');
      statusElement.classList.toggle('text-muted', !tone);
    }

    function buildMapUrl(latitude, longitude, zoom) {
      const lat = Number(latitude);
      const lng = Number(longitude);
      const level = Number(zoom || 16);
      const span = Math.max(0.002, 0.18 / Math.max(level, 1));
      const params = new URLSearchParams({
        bbox: [
          (lng - span).toFixed(7),
          (lat - span).toFixed(7),
          (lng + span).toFixed(7),
          (lat + span).toFixed(7),
        ].join(','),
        layer: 'mapnik',
        marker: [lat.toFixed(7), lng.toFixed(7)].join(','),
      });
      return 'https://www.openstreetmap.org/export/embed.html?' + params.toString();
    }

    function refreshMap(latitude, longitude, zoom) {
      const lat = Number(latitude);
      const lng = Number(longitude);
      if (Number.isNaN(lat) || Number.isNaN(lng)) {
        return;
      }
      if (isMobile && geoForm.dataset.mapVisible !== '1') {
        return;
      }
      mapFrame.src = buildMapUrl(lat, lng, zoom);
    }

    function showMap() {
      geoForm.dataset.mapVisible = '1';
      mapFrame.classList.remove('d-none');
      const lat = parseFloat(latitudeField.value);
      const lng = parseFloat(longitudeField.value);
      if (!Number.isNaN(lat) && !Number.isNaN(lng)) {
        refreshMap(lat, lng, 16);
      } else {
        refreshMap(defaultPoint[0], defaultPoint[1], 5);
      }
    }

    function setLocation(latitude, longitude, zoom) {
      const lat = Number(latitude);
      const lng = Number(longitude);
      if (Number.isNaN(lat) || Number.isNaN(lng)) {
        return;
      }
      latitudeField.value = lat.toFixed(7);
      longitudeField.value = lng.toFixed(7);
      refreshMap(lat, lng, zoom || 16);
    }

    function useDeviceLocation() {
      if (!navigator.geolocation) {
        setStatus('Browser tidak mendukung lokasi saat ini.', 'danger');
        return;
      }
      if (!window.isSecureContext) {
        setStatus('Lokasi saat ini membutuhkan akses HTTPS atau localhost.', 'danger');
        return;
      }
      setStatus('Mengambil lokasi saat ini...');
      navigator.geolocation.getCurrentPosition(function (position) {
        setLocation(position.coords.latitude, position.coords.longitude, 17);
        setStatus('Lokasi saat ini berhasil ditampilkan.', 'success');
      }, function () {
        setStatus('Tidak dapat mengambil lokasi saat ini. Pastikan izin lokasi aktif.', 'danger');
      }, {
        enableHighAccuracy: !isMobile,
        timeout: isMobile ? 10000 : 15000,
        maximumAge: 0,
      });
    }

    function searchLocation() {
      const query = searchInput ? searchInput.value.trim() : '';
      if (!query) {
        setStatus('Masukkan nama tempat yang ingin dicari.', 'danger');
        return;
      }

      setStatus('Mencari lokasi...');
      const url = new URL('https://nominatim.openstreetmap.org/search');
      url.searchParams.set('format', 'json');
      url.searchParams.set('limit', '1');
      url.searchParams.set('countrycodes', 'id');
      url.searchParams.set('q', query);

      fetch(url.toString(), {
        headers: { 'Accept': 'application/json' },
      })
        .then(function (response) { return response.ok ? response.json() : []; })
        .then(function (results) {
          if (!results.length) {
            setStatus('Lokasi tidak ditemukan di Indonesia.', 'danger');
            return;
          }
          setLocation(results[0].lat, results[0].lon, 16);
          setStatus(results[0].display_name || 'Lokasi ditemukan.', 'success');
        })
        .catch(function () {
          setStatus('Pencarian lokasi gagal. Coba beberapa saat lagi.', 'danger');
        });
    }

    scope.querySelectorAll('[data-spj-geotag-upload="1"]').forEach(function (input) {
      input.addEventListener('change', function () {
        if (input.files && input.files.length && !isMobile) {
          useDeviceLocation();
        } else if (input.files && input.files.length) {
          setStatus('Foto dipilih. Tekan Lokasi Saat Ini jika ingin mengisi titik lokasi.');
        }
      });
    });

    if (searchButton) {
      searchButton.addEventListener('click', searchLocation);
    }
    if (searchInput) {
      searchInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          searchLocation();
        }
      });
    }
    if (currentButton) {
      currentButton.addEventListener('click', useDeviceLocation);
    }
    if (mapButton) {
      mapButton.addEventListener('click', showMap);
    }

    if (isMobile && !hasInitialPoint) {
      setStatus('Peta tidak dimuat otomatis di HP agar halaman lebih ringan.');
    } else if (isMobile) {
      setStatus('Titik lokasi sudah ada. Tekan Tampilkan Peta jika perlu melihat peta.');
    } else if (!hasInitialPoint) {
      useDeviceLocation();
      refreshMap(startPoint[0], startPoint[1], 5);
    } else {
      refreshMap(startPoint[0], startPoint[1], 16);
    }
  }

  initializeGeoMap();
})();
</script>

<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  if (scope.dataset.spjPhotoFieldReady) {
    return;
  }
  scope.dataset.spjPhotoFieldReady = '1';

  function setStatus(wrapper, message, tone) {
    const status = wrapper.querySelector('[data-spj-photo-status]');
    if (!status) {
      return;
    }
    status.textContent = message || '';
    status.classList.toggle('text-danger', tone === 'danger');
    status.classList.toggle('text-success', tone === 'success');
    status.classList.toggle('text-muted', !tone);
  }

  scope.querySelectorAll('[data-spj-photo-field="1"]').forEach(function (wrapper) {
    const inputs = Array.prototype.slice.call(wrapper.querySelectorAll('input[type="file"]'));
    inputs.forEach(function (input) {
      input.addEventListener('change', function () {
        if (input.files && input.files.length) {
          inputs.forEach(function (otherInput) {
            if (otherInput !== input) {
              otherInput.value = '';
            }
          });
        }

        if (input.files && input.files.length) {
          const file = input.files[0];
          const source = input.hasAttribute('data-spj-camera-source') ? 'kamera' : 'galeri';
          setStatus(wrapper, (file.name || 'Foto') + ' siap dari ' + source + '.', 'success');
        }
      });
    });
  });
})();
</script>
<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  const sptField = scope.querySelector('[data-spj-availability-url]');
  if (!sptField || sptField.dataset.availabilityReady) {
    return;
  }
  sptField.dataset.availabilityReady = '1';

  const pelaksanaField = scope.querySelector('[data-spj-pelaksana-field="1"]');
  const jenisSpjField = scope.querySelector('[data-spj-jenis-spj-field="1"]');
  const jenisTransportField = scope.querySelector('[data-spj-jenis-transportasi-field="1"]');

  function setDisabledOptions(field, disabledIds) {
    if (!field) {
      return;
    }
    const selectedValue = field.value;
    const disabledSet = new Set((disabledIds || []).map(String));

    Array.prototype.forEach.call(field.options, function (option) {
      if (!option.value) {
        return;
      }
      const disabled = disabledSet.has(option.value);
      option.disabled = disabled;
      option.hidden = disabled;
    });

    if (field.value && disabledSet.has(field.value)) {
      field.value = '';
    } else if (selectedValue && field.value !== selectedValue) {
      field.value = selectedValue;
    }

    if (window.jQuery && window.jQuery.fn.select2) {
      window.jQuery(field).trigger('change.select2');
    }
  }

  function refreshAvailability() {
    const url = sptField.dataset.spjAvailabilityUrl;
    if (!url) {
      return;
    }

    const params = new URLSearchParams({
      model: sptField.dataset.spjAvailabilityModel || '',
      spt: sptField.value || '',
      pelaksana: pelaksanaField ? pelaksanaField.value || '' : '',
      jenis_spj: jenisSpjField ? jenisSpjField.value || '' : '',
      instance: sptField.dataset.spjAvailabilityInstance || '',
    });

    fetch(url + '?' + params.toString(), {
      headers: { 'Accept': 'application/json' },
    })
      .then(function (response) { return response.ok ? response.json() : {}; })
      .then(function (data) {
        setDisabledOptions(jenisSpjField, data.unavailable_jenis_spj);
        setDisabledOptions(jenisTransportField, data.unavailable_jenis_transportasi);
      });
  }

  [sptField, pelaksanaField, jenisSpjField].forEach(function (field) {
    if (!field) {
      return;
    }
    field.addEventListener('change', refreshAvailability);
    if (window.jQuery && window.jQuery.fn.select2) {
      window.jQuery(field).on('select2:select select2:clear', refreshAvailability);
    }
  });

  refreshAvailability();
})();
</script>
