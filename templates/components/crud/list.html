<div id="table-container">

  <!-- 🔥 FORM (HTMX ENABLED) -->
  <form id="filter-form"
      method="get"
      onsubmit="event.preventDefault(); window.reloadTableWithPage('1'); return false;"
      class="d-flex align-items-center gap-2 flex-nowrap w-100 pb-2 mb-2 border-bottom"
      style="display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important;">

    <!-- per page -->
    <select name="per_page"
        class="form-select form-select-sm"
        style="width:80px; min-width:80px; flex: 0 0 80px;">
      <option value="10" {% if request.GET.per_page == "10" %}selected{% endif %}>10</option>
      <option value="25" {% if request.GET.per_page == "25" or request.GET.per_page == "all" %}selected{% endif %}>25</option>
      <option value="50" {% if request.GET.per_page == "50" %}selected{% endif %}>50</option>
    </select>

    <!-- search -->
    <div class="position-relative flex-grow-1" style="min-width: 0;">
      <input type="search" name="search" id="crud-search-input"
         class="form-control form-control-sm w-100"
         placeholder="Cari Data..."
         value="{{ request.GET.search }}"
         autocomplete="off">
    </div>

  </form>

  <!-- TABLE -->
  <div class="table-responsive" hx-boost="true" hx-target="#table-container" hx-swap="outerHTML">
    {% load django_tables2 %}
    {% render_table table %}
  </div>

</div>

<script>
(function () {
    function getPageStorageKey() {
        return `crudLastPage:${window.location.pathname}`;
    }

    function setStoredPage(page) {
        localStorage.setItem(getPageStorageKey(), String(page || '1'));
    }

    function getStoredPage() {
        return localStorage.getItem(getPageStorageKey()) || '1';
    }

    function getCurrentPageFromTable() {
        const activePage = document.querySelector(
            '#table-container .pagination .active .page-link, ' +
            '#table-container .pagination .active a, ' +
            '#table-container .pagination .active span'
        );
        const pageText = activePage?.textContent?.trim();

        if (pageText && /^\d+$/.test(pageText)) {
            return pageText;
        }

        return document.querySelector('#table-container .pagination') ? getStoredPage() : '1';
    }

    function syncStoredPageFromTable() {
        setStoredPage(getCurrentPageFromTable());
    }

    function setPasswordVisibility(button, isVisible) {
        const wrapper = button.closest('.d-inline-flex');
        const valueElement = wrapper?.querySelector('.pemda-password-value');
        const icon = button.querySelector('i');

        if (!valueElement) {
            return;
        }

        valueElement.textContent = isVisible
            ? valueElement.dataset.passwordValue
            : valueElement.dataset.passwordMask;
        valueElement.classList.toggle('text-muted', !isVisible);
        button.setAttribute('aria-pressed', isVisible ? 'true' : 'false');

        if (icon) {
            icon.classList.toggle('ti-eye', !isVisible);
            icon.classList.toggle('ti-eye-off', isVisible);
        }
    }

    function buildRequestUrl(page = null) {
        const filterForm = document.getElementById('filter-form');
        const perPageSelect = filterForm?.querySelector('[name="per_page"]');
        const searchInput = filterForm?.querySelector('[name="search"]');
        const url = new URL(window.location.origin + window.location.pathname);
        const targetPage = page || getStoredPage();

        url.searchParams.set('page', targetPage);
        url.searchParams.set('per_page', perPageSelect?.value || '10');

        const searchValue = searchInput ? searchInput.value.trim() : '';
        if (searchValue) {
            url.searchParams.set('search', searchValue);
        } else {
            url.searchParams.delete('search');
        }

        return url.toString();
    }

    window.reloadTableWithPage = function (page = null) {
        const tableContainer = document.getElementById('table-container');

        if (!tableContainer) {
            return;
        }

        const searchInput = document.getElementById('crud-search-input');
        const isSearchFocused = document.activeElement === searchInput;
        const cursorPosition = searchInput ? searchInput.selectionStart : null;

        const requestUrl = buildRequestUrl(page);

        try {
            window.history.replaceState({ path: requestUrl }, '', requestUrl);
        } catch (e) {}

        htmx.ajax('GET', requestUrl, {
            target: '#table-container',
            swap: 'outerHTML'
        }).then(function () {
            if (isSearchFocused) {
                const newSearchInput = document.getElementById('crud-search-input');
                if (newSearchInput) {
                    newSearchInput.focus();
                    if (cursorPosition !== null) {
                        try {
                            newSearchInput.setSelectionRange(cursorPosition, cursorPosition);
                        } catch (e) {}
                    }
                }
            }
        });
    };

    function initializeCrudList() {
        const tableContainer = document.getElementById('table-container');
        const filterForm = document.getElementById('filter-form');

        if (!tableContainer || !filterForm) {
            return;
        }

        const perPageSelect = filterForm.querySelector('[name="per_page"]');
        const searchInput = filterForm.querySelector('[name="search"]');

        syncStoredPageFromTable();

        if (filterForm && !filterForm.dataset.submitHandlerBound) {
            filterForm.dataset.submitHandlerBound = 'true';
            filterForm.addEventListener('submit', function (e) {
                e.preventDefault();
                setStoredPage('1');
                window.reloadTableWithPage('1');
                return false;
            });
        }

        if (perPageSelect && !perPageSelect.dataset.pageHandlerBound) {
            perPageSelect.dataset.pageHandlerBound = 'true';
            perPageSelect.addEventListener('change', function () {
                setStoredPage('1');
                window.reloadTableWithPage('1');
            });
        }

        if (searchInput && !searchInput.dataset.searchHandlerBound) {
            let searchTimeout;

            searchInput.dataset.searchHandlerBound = 'true';
            searchInput.addEventListener('input', function () {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(function () {
                    setStoredPage('1');
                    window.reloadTableWithPage('1');
                }, 400);
            });

            searchInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(searchTimeout);
                    setStoredPage('1');
                    window.reloadTableWithPage('1');
                }
            });

            searchInput.addEventListener('search', function () {
                clearTimeout(searchTimeout);
                setStoredPage('1');
                window.reloadTableWithPage('1');
            });
        }
        }

        if (!tableContainer.dataset.paginationHandlerBound) {
            tableContainer.dataset.paginationHandlerBound = 'true';
            tableContainer.addEventListener('click', function (event) {
                const link = event.target.closest('a[href]');

                if (!link) {
                    return;
                }

                const url = new URL(link.href, window.location.origin);
                const pageParam = url.searchParams.get('page');

                if (pageParam) {
                    setStoredPage(pageParam);
                }
            });
        }

        if (!tableContainer.dataset.passwordToggleHandlerBound) {
            tableContainer.dataset.passwordToggleHandlerBound = 'true';

            tableContainer.addEventListener('pointerdown', function (event) {
                const button = event.target.closest('.pemda-password-toggle');

                if (button) {
                    button.setPointerCapture?.(event.pointerId);
                    setPasswordVisibility(button, true);
                }
            });

            ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach(function (eventName) {
                tableContainer.addEventListener(eventName, function (event) {
                    const button = event.target.closest('.pemda-password-toggle');

                    if (button) {
                        setPasswordVisibility(button, false);
                    }
                }, true);
            });

            tableContainer.addEventListener('keydown', function (event) {
                const button = event.target.closest('.pemda-password-toggle');

                if (button && ['Enter', ' '].includes(event.key) && !event.repeat) {
                    event.preventDefault();
                    setPasswordVisibility(button, true);
                }
            });

            tableContainer.addEventListener('keyup', function (event) {
                const button = event.target.closest('.pemda-password-toggle');

                if (button && ['Enter', ' '].includes(event.key)) {
                    setPasswordVisibility(button, false);
                }
            });
        }
    }

    if (!window.__crudListHandlersBound) {
        document.body.addEventListener('htmx:afterRequest', function (event) {
            const xhr = event?.detail?.xhr;
            const requestPath = event?.detail?.pathInfo?.requestPath || '';
            const isCrudSubmission = requestPath.includes('/form/') || requestPath.includes('/delete/');

            if (xhr?.status !== 204 || !isCrudSubmission) {
                return;
            }

            if (window.closeCrudModal) {
                window.closeCrudModal();
            }

            setTimeout(function () {
                window.reloadTableWithPage();
            }, 200);
        });

        document.body.addEventListener('htmx:afterSwap', function (event) {
            const targetId = event.detail.target?.id;

            if (targetId === 'table-container' || targetId === 'main-content') {
                initializeCrudList();
                syncStoredPageFromTable();
            }
        });

        window.__crudListHandlersBound = true;
    }

    initializeCrudList();
})();
</script>
