<div id="table-container">

  <!-- 🔥 FORM (HTMX ENABLED) -->
  <form id="filter-form"
      method="get"
      action="{{ request.path }}"
      hx-get="{{ request.path }}"
      hx-target="#table-container"
      hx-swap="outerHTML"
      hx-push-url="true"
      hx-trigger="submit"
      onsubmit="event.preventDefault(); return false;"
      class="d-flex align-items-center gap-2 flex-nowrap w-100 pb-2 mb-2 border-bottom"
      style="display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important;">

    <input type="hidden" name="page" value="1">

    <!-- per page -->
    <select name="per_page"
        class="form-select form-select-sm"
        style="width:80px; min-width:80px; flex: 0 0 80px;"
        hx-get="{{ request.path }}"
        hx-trigger="change"
        hx-target="#table-container"
        hx-swap="outerHTML"
        hx-push-url="true"
        hx-include="#filter-form">
      <option value="10" {% if request.GET.per_page == "10" or not request.GET.per_page %}selected{% endif %}>10</option>
      <option value="25" {% if request.GET.per_page == "25" or request.GET.per_page == "all" %}selected{% endif %}>25</option>
      <option value="50" {% if request.GET.per_page == "50" %}selected{% endif %}>50</option>
    </select>

    <!-- search -->
    <div class="position-relative flex-grow-1" style="min-width: 0;">
      <input type="search" name="search" id="crud-search-input"
         class="form-control form-control-sm w-100"
         placeholder="Cari Data..."
         value="{{ request.GET.search|default:'' }}"
         autocomplete="off"
         hx-get="{{ request.path }}"
         hx-trigger="input changed delay:800ms, search, keyup[key=='Enter']"
         hx-target="#table-container"
         hx-swap="outerHTML"
         hx-push-url="true"
         hx-include="#filter-form">
    </div>

  </form>

  <!-- TABLE -->
  <div class="table-responsive" hx-boost="true" hx-target="#table-container" hx-swap="outerHTML">
    {% load django_tables2 %}
    {% render_table table %}
  </div>

</div>

<script>
(function () {
    // Preserve search input focus and cursor across HTMX swaps
    if (!window.__crudSearchFocusHandlerBound) {
        document.addEventListener('htmx:beforeRequest', function (e) {
            const input = document.getElementById('crud-search-input');
            window.__crudSearchWasFocused = (document.activeElement === input);
            window.__crudSearchCursorPos = input ? input.selectionStart : null;
        });

        document.addEventListener('htmx:afterSwap', function (e) {
            if (window.__crudSearchWasFocused) {
                const input = document.getElementById('crud-search-input');
                if (input) {
                    input.focus();
                    if (window.__crudSearchCursorPos !== null && input.setSelectionRange) {
                        try {
                            input.setSelectionRange(window.__crudSearchCursorPos, window.__crudSearchCursorPos);
                        } catch (err) {}
                    }
                }
            }
        });

        window.__crudSearchFocusHandlerBound = true;
    }

    // Global reloadTableWithPage helper for modal submissions
    window.reloadTableWithPage = function (page = null) {
        const form = document.getElementById('filter-form');
        if (!form) return;
        if (page) {
            const pageInput = form.querySelector('[name="page"]');
            if (pageInput) pageInput.value = page;
        }
        if (window.htmx) {
            htmx.trigger(form, 'submit');
        }
    };

    // Password visibility toggle handler
    function setPasswordVisibility(button, isVisible) {
        const wrapper = button.closest('.d-inline-flex');
        const valueElement = wrapper?.querySelector('.pemda-password-value');
        const icon = button.querySelector('i');

        if (!valueElement) return;

        valueElement.textContent = isVisible
            ? valueElement.dataset.passwordValue
            : valueElement.dataset.passwordMask;
        valueElement.classList.toggle('text-muted', !isVisible);
        button.setAttribute('aria-pressed', isVisible ? 'true' : 'false');

        if (icon) {
            icon.classList.toggle('ti-eye', !isVisible);
            icon.classList.toggle('ti-eye-off', isVisible);
        }
    }

    if (!window.__crudPasswordToggleBound) {
        document.addEventListener('pointerdown', function (event) {
            const button = event.target.closest('.pemda-password-toggle');
            if (button) {
                button.setPointerCapture?.(event.pointerId);
                setPasswordVisibility(button, true);
            }
        });

        ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach(function (eventName) {
            document.addEventListener(eventName, function (event) {
                const button = event.target.closest('.pemda-password-toggle');
                if (button) {
                    setPasswordVisibility(button, false);
                }
            }, true);
        });

        document.addEventListener('keydown', function (event) {
            const button = event.target.closest('.pemda-password-toggle');
            if (button && ['Enter', ' '].includes(event.key) && !event.repeat) {
                event.preventDefault();
                setPasswordVisibility(button, true);
            }
        });

        document.addEventListener('keyup', function (event) {
            const button = event.target.closest('.pemda-password-toggle');
            if (button && ['Enter', ' '].includes(event.key)) {
                setPasswordVisibility(button, false);
            }
        });

        window.__crudPasswordToggleBound = true;
    }

    // Modal submit reload listener
    if (!window.__crudListHandlersBound) {
        document.body.addEventListener('htmx:afterRequest', function (event) {
            const xhr = event?.detail?.xhr;
            const requestPath = event?.detail?.pathInfo?.requestPath || '';
            const isCrudSubmission = requestPath.includes('/form/') || requestPath.includes('/delete/');

            if (xhr?.status !== 204 || !isCrudSubmission) {
                return;
            }

            if (window.closeCrudModal) {
                window.closeCrudModal();
            }

            setTimeout(function () {
                window.reloadTableWithPage();
            }, 200);
        });

        window.__crudListHandlersBound = true;
    }
})();
</script>
