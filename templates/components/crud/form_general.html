<div class="modal-header border-0 pb-0">
  <div>
    <h5 class="modal-title">{{ title }}</h5>
    <div class="text-muted small">Lengkapi data berikut lalu simpan perubahan.</div>
  </div>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<form
  method="post"
  action="{{ request.path }}"
  hx-post="{{ request.path }}"
  hx-target="#modal-body"
  hx-swap="innerHTML"
  {% if is_multipart_form %}
    enctype="multipart/form-data"
    hx-encoding="multipart/form-data"
  {% endif %}
>
  {% csrf_token %}

  <div class="modal-body pt-3">
    {% if form.non_field_errors %}
      <div class="alert alert-danger">
        {{ form.non_field_errors }}
      </div>
    {% endif %}

    {% include "components/crud/form_fields.html" with form=form %}
  </div>

  <div class="modal-footer border-0 pt-0">
    <button type="submit" class="btn btn-success">
      Simpan
    </button>

    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
      Batal
    </button>
  </div>
</form>
<script>
(function () {
  const sptField = document.querySelector('[data-spj-spt-field="1"]');
  const pelaksanaField = document.querySelector('[data-spj-pelaksana-field="1"]');

  if (!sptField || !pelaksanaField || pelaksanaField.dataset.spjBindingReady) {
    return;
  }

  pelaksanaField.dataset.spjBindingReady = '1';

  function replaceOptions(items, selectedValue) {
    pelaksanaField.innerHTML = '';
    const emptyOption = document.createElement('option');
    emptyOption.value = '';
    emptyOption.textContent = '---------';
    pelaksanaField.appendChild(emptyOption);

    items.forEach(function (item) {
      const option = document.createElement('option');
      option.value = item.id;
      option.textContent = item.text;
      if (String(item.id) === String(selectedValue)) {
        option.selected = true;
      }
      pelaksanaField.appendChild(option);
    });

    if (window.jQuery && window.jQuery.fn.select2) {
      window.jQuery(pelaksanaField).trigger('change.select2');
    } else {
      pelaksanaField.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }

  function loadPelaksana() {
    const sptId = sptField.value;
    const url = pelaksanaField.dataset.spjPelaksanaUrl;
    if (!sptId || !url) {
      return;
    }

    const selectedValue = pelaksanaField.value;
    fetch(url + '?spt=' + encodeURIComponent(sptId), {
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    })
      .then(function (response) { return response.json(); })
      .then(function (data) { replaceOptions(data.results || [], selectedValue); })
      .catch(function () {});
  }

  sptField.addEventListener('change', loadPelaksana);
  if (sptField.value) {
    loadPelaksana();
  }
})();
</script>
