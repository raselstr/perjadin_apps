<div class="modal-header border-0 pb-0">
  <div>
    <h5 class="modal-title">{{ title }}</h5>
    <div class="text-muted small">Lengkapi data berikut lalu simpan perubahan.</div>
  </div>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<form
  method="post"
  action="{{ request.path }}"
  hx-post="{{ request.path }}"
  hx-target="#modal-body"
  hx-swap="innerHTML"
  {% if is_multipart_form %}
    enctype="multipart/form-data"
    hx-encoding="multipart/form-data"
  {% endif %}
>
  {% csrf_token %}

  <div class="modal-body pt-3">
    {% if form.non_field_errors %}
      <div class="alert alert-danger">
        {{ form.non_field_errors }}
      </div>
    {% endif %}

    {% include "components/crud/form_fields.html" with form=form %}
  </div>

  <div class="modal-footer border-0 pt-0">
    <button type="submit" class="btn btn-success">
      Simpan
    </button>

    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
      Batal
    </button>
  </div>
</form>
<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  const sptField = scope.querySelector('[data-spj-spt-field="1"]');
  const pelaksanaField = scope.querySelector('[data-spj-pelaksana-field="1"]');
  const jenisSpjField = scope.querySelector('[data-spj-jenis-spj-field="1"]');
  if (!pelaksanaField || pelaksanaField.dataset.spjHtmxBindingReady) {
    return;
  }
  pelaksanaField.dataset.spjHtmxBindingReady = '1';

  function refreshSelect2Field(field) {
    if (!window.jQuery || !window.jQuery.fn.select2) {
      field.dispatchEvent(new Event('change', { bubbles: true }));
      return;
    }

    const $field = window.jQuery(field);
    const $dropdownParent = $field.closest('[data-formset-row], .modal');
    if ($field.hasClass('select2-hidden-accessible')) {
      $field.select2('destroy');
    }
    $field.select2({
      width: '100%',
      dropdownParent: $dropdownParent.length ? $dropdownParent : window.jQuery(document.body),
      theme: 'bootstrap-5'
    });
    $field.trigger('change');
  }

  document.body.addEventListener('htmx:afterSwap', function (event) {
    if (event.detail.target !== pelaksanaField) {
      return;
    }
    refreshSelect2Field(pelaksanaField);
  });

  if (window.jQuery && window.jQuery.fn.select2 && window.htmx && sptField) {
    window.jQuery(sptField).on('select2:select select2:clear', function () {
      window.htmx.trigger(sptField, 'change');
    });
    if (jenisSpjField) {
      window.jQuery(jenisSpjField).on('select2:select select2:clear', function () {
        window.htmx.trigger(sptField, 'change');
      });
    }
  }
})();
</script>
<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  const sptField = scope.querySelector('[data-spj-calculation-url]');
  const pelaksanaField = scope.querySelector('[data-spj-pelaksana-field="1"]');
  if (!sptField || !pelaksanaField || sptField.dataset.calculationReady) {
    return;
  }
  sptField.dataset.calculationReady = '1';

  function setCalculatedValue(name, value) {
    const field = scope.querySelector('[data-spj-calculation-field="' + name + '"]');
    if (field) {
      field.value = value || '';
    }
  }

  function loadCalculation() {
    const url = sptField.dataset.spjCalculationUrl;
    const kind = sptField.dataset.spjCalculationKind;
    if (!url || !kind || !sptField.value || !pelaksanaField.value) {
      setCalculatedValue('nilai', '');
      setCalculatedValue('total', '');
      return;
    }

    const params = new URLSearchParams({
      jenis: kind,
      spt: sptField.value,
      pelaksana: pelaksanaField.value,
    });
    fetch(url + '?' + params.toString(), {
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        setCalculatedValue('nilai', data.nilai);
        setCalculatedValue('total', data.total);
      })
      .catch(function () {});
  }

  sptField.addEventListener('change', function () {
    setTimeout(loadCalculation, 300);
  });
  pelaksanaField.addEventListener('change', loadCalculation);
  if (window.jQuery && window.jQuery.fn.select2) {
    window.jQuery(pelaksanaField).on('select2:select', loadCalculation);
  }
  loadCalculation();
})();
</script>
<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  scope.querySelectorAll('[data-spj-rich-editor="1"]').forEach(function (textarea) {
    if (textarea.dataset.richReady) {
      return;
    }
    textarea.dataset.richReady = '1';

    const wrapper = document.createElement('div');
    wrapper.className = 'spj-rich-editor border rounded';
    const toolbar = document.createElement('div');
    toolbar.className = 'd-flex flex-wrap gap-1 border-bottom bg-light p-2';
    const editor = document.createElement('div');
    editor.className = 'p-2';
    editor.contentEditable = 'true';
    editor.style.minHeight = '150px';
    editor.style.outline = 'none';
    editor.innerHTML = textarea.value || '';

    function addButton(label, command, value) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn btn-sm btn-outline-secondary';
      button.textContent = label;
      button.addEventListener('click', function () {
        editor.focus();
        document.execCommand(command, false, value || null);
        textarea.value = editor.innerHTML;
      });
      toolbar.appendChild(button);
    }

    function addSelect(options, command) {
      const select = document.createElement('select');
      select.className = 'form-select form-select-sm';
      select.style.width = 'auto';
      options.forEach(function (item) {
        const option = document.createElement('option');
        option.value = item.value;
        option.textContent = item.label;
        select.appendChild(option);
      });
      select.addEventListener('change', function () {
        editor.focus();
        document.execCommand(command, false, select.value);
        textarea.value = editor.innerHTML;
      });
      toolbar.appendChild(select);
    }

    addSelect([
      { label: 'Paragraf', value: 'p' },
      { label: 'Judul 1', value: 'h1' },
      { label: 'Judul 2', value: 'h2' },
      { label: 'Judul 3', value: 'h3' },
    ], 'formatBlock');
    addSelect([
      { label: 'Arial', value: 'Arial' },
      { label: 'Times New Roman', value: 'Times New Roman' },
      { label: 'Calibri', value: 'Calibri' },
    ], 'fontName');
    addSelect([
      { label: 'Normal', value: '3' },
      { label: 'Kecil', value: '2' },
      { label: 'Besar', value: '4' },
      { label: 'Sangat Besar', value: '5' },
    ], 'fontSize');
    addButton('B', 'bold');
    addButton('I', 'italic');
    addButton('U', 'underline');
    addButton('Bullet', 'insertUnorderedList');
    addButton('Numbering', 'insertOrderedList');
    addButton('Tab', 'insertHTML', '&emsp;');

    editor.addEventListener('input', function () {
      textarea.value = editor.innerHTML;
    });
    textarea.form?.addEventListener('submit', function () {
      textarea.value = editor.innerHTML;
    });

    textarea.classList.add('d-none');
    textarea.parentNode.insertBefore(wrapper, textarea);
    wrapper.appendChild(toolbar);
    wrapper.appendChild(editor);
  });
})();
</script>
{% if form.has_geo_map %}
<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  
  scope.querySelectorAll('.spj-geo-maplibre-widget').forEach(function(widget) {
    const mapContainer = widget.querySelector('.spj-geo-maplibre-map');
    const latInput = widget.querySelector('input[data-role="latitude"]');
    const lngInput = widget.querySelector('input[data-role="longitude"]');
    
    if (!mapContainer || !latInput || !lngInput) {
      return;
    }
    
    if (widget.dataset.geoReady) {
      return;
    }
    widget.dataset.geoReady = '1';
    
    if (typeof maplibregl === 'undefined') {
      console.warn('MapLibre GL JS not loaded');
      return;
    }
    
    const initialLat = parseFloat(latInput.value) || -2.548926;
    const initialLng = parseFloat(lngInput.value) || 118.0148634;
    
    const map = new maplibregl.Map({
      container: mapContainer,
      style: 'https://demotiles.maplibre.org/style.json',
      center: [initialLng, initialLat],
      zoom: parseFloat(lngInput.value) ? 16 : 5
    });
    
    const marker = new maplibregl.Marker({ draggable: true })
      .setLngLat([initialLng, initialLat])
      .addTo(map);
    
    function updateFields() {
      const lngLat = marker.getLngLat();
      latInput.value = lngLat.lat.toFixed(7);
      lngInput.value = lngLat.lng.toFixed(7);
    }
    
    marker.on('dragend', updateFields);
    
    map.on('click', function(e) {
      marker.setLngLat(e.lngLat);
      map.flyTo({ center: e.lngLat, zoom: 16 });
      updateFields();
    });
    
    const searchBox = widget.querySelector('input[data-role="search"]');
    const searchBtn = widget.querySelector('button[data-role="search-btn"]');
    const currentBtn = widget.querySelector('button[data-role="current-btn"]');
    const clearBtn = widget.querySelector('button[data-role="clear-btn"]');
    const statusEl = widget.querySelector('[data-role="status"]');
    
    function setStatus(msg, type) {
      if (statusEl) {
        statusEl.textContent = msg;
        statusEl.className = 'small mt-1 ' + (type ? 'text-' + type : 'text-muted');
      }
    }
    
    if (searchBtn && searchBox) {
      function doSearch() {
        const query = searchBox.value.trim();
        if (!query) {
          setStatus('Masukkan nama tempat.', 'danger');
          return;
        }
        
        setStatus('Mencari lokasi...', '');
        const url = new URL('https://nominatim.openstreetmap.org/search');
        url.searchParams.set('format', 'json');
        url.searchParams.set('limit', '1');
        url.searchParams.set('countrycodes', 'id');
        url.searchParams.set('q', query);
        
        fetch(url.toString(), { headers: { 'Accept': 'application/json' } })
          .then(r => r.ok ? r.json() : [])
          .then(results => {
            if (!results.length) {
              setStatus('Lokasi tidak ditemukan.', 'danger');
              return;
            }
            const lat = parseFloat(results[0].lat);
            const lng = parseFloat(results[0].lon);
            marker.setLngLat([lng, lat]);
            map.flyTo({ center: [lng, lat], zoom: 16 });
            latInput.value = lat.toFixed(7);
            lngInput.value = lng.toFixed(7);
            setStatus(results[0].display_name || 'Lokasi ditemukan.', 'success');
          })
          .catch(() => setStatus('Pencarian gagal.', 'danger'));
      }
      
      searchBtn.addEventListener('click', doSearch);
      searchBox.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          doSearch();
        }
      });
    }
    
    if (currentBtn) {
      currentBtn.addEventListener('click', () => {
        if (!navigator.geolocation) {
          setStatus('Browser tidak mendukung geolocation.', 'danger');
          return;
        }
        if (!window.isSecureContext) {
          setStatus('Geolocation memerlukan HTTPS.', 'danger');
          return;
        }
        setStatus('Mengambil lokasi saat ini...', '');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            marker.setLngLat([lng, lat]);
            map.flyTo({ center: [lng, lat], zoom: 17 });
            latInput.value = lat.toFixed(7);
            lngInput.value = lng.toFixed(7);
            setStatus('Lokasi berhasil ditampilkan.', 'success');
          },
          () => setStatus('Tidak dapat mengakses lokasi.', 'danger'),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      });
    }
    
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        marker.setLngLat([118.0148634, -2.548926]);
        latInput.value = '';
        lngInput.value = '';
        map.flyTo({ center: [118.0148634, -2.548926], zoom: 5 });
        setStatus('', '');
      });
    }
  });
})();
</script>

<script>
(function () {
  const scope = document.currentScript.closest('.modal-content') || document;
  const sptField = scope.querySelector('[data-spj-availability-url]');
  if (!sptField || sptField.dataset.availabilityReady) {
    return;
  }
  sptField.dataset.availabilityReady = '1';

  const pelaksanaField = scope.querySelector('[data-spj-pelaksana-field="1"]');
  const jenisSpjField = scope.querySelector('[data-spj-jenis-spj-field="1"]');
  const jenisTransportField = scope.querySelector('[data-spj-jenis-transportasi-field="1"]');

  function setDisabledOptions(field, disabledIds) {
    if (!field) {
      return;
    }
    const selectedValue = field.value;
    const disabledSet = new Set((disabledIds || []).map(String));

    Array.prototype.forEach.call(field.options, function (option) {
      if (!option.value) {
        return;
      }
      const disabled = disabledSet.has(option.value);
      option.disabled = disabled;
      option.hidden = disabled;
    });

    if (field.value && disabledSet.has(field.value)) {
      field.value = '';
    } else if (selectedValue && field.value !== selectedValue) {
      field.value = selectedValue;
    }

    if (window.jQuery && window.jQuery.fn.select2) {
      window.jQuery(field).trigger('change.select2');
    }
  }

  function refreshAvailability() {
    const url = sptField.dataset.spjAvailabilityUrl;
    if (!url) {
      return;
    }

    const params = new URLSearchParams({
      model: sptField.dataset.spjAvailabilityModel || '',
      spt: sptField.value || '',
      pelaksana: pelaksanaField ? pelaksanaField.value || '' : '',
      jenis_spj: jenisSpjField ? jenisSpjField.value || '' : '',
      instance: sptField.dataset.spjAvailabilityInstance || '',
    });

    fetch(url + '?' + params.toString(), {
      headers: { 'Accept': 'application/json' },
    })
      .then(function (response) { return response.ok ? response.json() : {}; })
      .then(function (data) {
        setDisabledOptions(jenisSpjField, data.unavailable_jenis_spj);
        setDisabledOptions(jenisTransportField, data.unavailable_jenis_transportasi);
      });
  }

  [sptField, pelaksanaField, jenisSpjField].forEach(function (field) {
    if (!field) {
      return;
    }
    field.addEventListener('change', refreshAvailability);
    if (window.jQuery && window.jQuery.fn.select2) {
      window.jQuery(field).on('select2:select select2:clear', refreshAvailability);
    }
  });

  refreshAvailability();
})();
</script>
