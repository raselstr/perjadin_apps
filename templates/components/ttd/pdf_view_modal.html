<div class="modal-header">
    <h5 class="modal-title">Lihat PDF Hardcopy - {{ pemberi_tugas_name }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body p-0" style="height: 600px; overflow: hidden;">
    <iframe 
        src="{{ pdf_url }}" 
        style="width: 100%; height: 100%; border: none;"
        title="PDF Viewer">
    </iframe>
</div>
<div class="modal-footer">
    <a href="{{ download_url|default:pdf_url }}" target="_blank" class="btn btn-sm btn-outline-secondary">
        Buka Tab Baru
    </a>
    <a href="{{ download_url|default:pdf_url }}" download class="btn btn-sm btn-primary">
        <i class="fas fa-download"></i> Download
    </a>
    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">
        Tutup
    </button>
</div>
