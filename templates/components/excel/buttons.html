<!-- Toolbar Tombol Aksi Ekspor & Cetak Data (Excel + PDF) -->
<div class="d-inline-flex flex-wrap gap-2 align-items-center table-export-toolbar">
  {% if export_url %}
  <a href="{{ export_url }}" 
     class="btn btn-sm btn-export-excel" 
     title="Unduh seluruh data tabel dalam format Microsoft Excel (.xlsx)"
     onclick="showExportLoading(this)">
    <i class="ti ti-file-spreadsheet me-1"></i>
    <span class="export-text">Excel</span>
    <span class="export-spinner d-none">
      <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
      Mengunduh...
    </span>
  </a>
  {% endif %}

  <!-- Tombol Cetak / PDF untuk semua tabel data -->
  <button type="button" 
          class="btn btn-sm btn-export-pdf" 
          onclick="window.print()"
          title="Cetak tabel atau simpan sebagai berkas PDF">
    <i class="ti ti-printer me-1"></i>
    <span>Cetak / PDF</span>
  </button>
  
  {% if import_url and user.is_superuser %}
  <button type="button" 
          class="btn btn-sm btn-outline-secondary" 
          hx-get="{{ import_url }}"
          hx-target="#modal-body"
          hx-trigger="click"
          title="Unggah dan impor data dari berkas Excel">
    <i class="ti ti-upload me-1"></i>
    <span>Impor Excel</span>
  </button>
  {% endif %}
</div>

<script>
function showExportLoading(button) {
  const textSpan = button.querySelector('.export-text');
  const spinnerSpan = button.querySelector('.export-spinner');
  
  if (textSpan && spinnerSpan) {
    textSpan.classList.add('d-none');
    spinnerSpan.classList.remove('d-none');
    
    setTimeout(() => {
      textSpan.classList.remove('d-none');
      spinnerSpan.classList.add('d-none');
    }, 4000);
  }
}
</script>
