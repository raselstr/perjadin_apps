{% extends 'layouts/base.html' %}

{% block title %}Hapus {{ title }}{% endblock title %}

{% block content %}
<div class="pc-container">
  <div class="pc-content">
    <div class="page-header">
      <div class="page-block">
        <div class="row align-items-center">
          <div class="col-md-12">
            <div class="page-header-title">
              <h5 class="m-b-10">Hapus {{ title }}</h5>
            </div>
            <ul class="breadcrumb">
              <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Dashboard</a></li>
              <li class="breadcrumb-item"><a href="{% url url_list %}">{{ title }}</a></li>
              <li class="breadcrumb-item" aria-current="page">Hapus</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-8 col-xl-6">
        <div class="card">
          <div class="card-header">
            <h3 class="mb-0 text-danger">Konfirmasi Hapus</h3>
          </div>
          <div class="card-body">
            <p class="mb-4">
              Data <strong>{{ object }}</strong> akan dihapus permanen.
            </p>
            <form method="post" action="{{ request.path }}">
              {% csrf_token %}
              <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" href="{% url url_list %}">
                  Batal
                </a>
                <button type="submit" class="btn btn-danger">
                  Hapus
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
