{% load static %}
<!-- [ Pre-loader Asahan 3D Identity ] start -->
<div class="loader-bg">
  <div class="loader-track">
    <div class="loader-fill"></div>
  </div>
</div>
<!-- [ Pre-loader ] end -->

<!-- [ Nano Top Progress Bar ] start -->
<div id="app-top-progress" aria-hidden="true"></div>
<!-- [ Nano Top Progress Bar ] end -->

<!-- [ Professional 3D Action Loader Overlay ] start -->
<div id="app-action-loader" aria-hidden="true" role="status" aria-live="polite">
  <div class="app-loader-card">
    <div class="app-orbit-spinner">
      <div class="app-orbit-outer"></div>
      <div class="app-orbit-inner"></div>
      <div class="app-orbit-core"></div>
    </div>
    <div class="app-loader-title" id="app-loader-title">Memproses Data</div>
    <p class="app-loader-desc" id="app-loader-desc">
      <span id="app-loader-desc-text">Mohon tunggu sebentar</span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </p>
  </div>
</div>
<!-- [ Professional 3D Action Loader Overlay ] end -->

<script>
(function () {
  if (window.AppLoader) {
    return;
  }

  const progressBar = document.getElementById('app-top-progress');
  const actionOverlay = document.getElementById('app-action-loader');
  const titleEl = document.getElementById('app-loader-title');
  const descTextEl = document.getElementById('app-loader-desc-text');

  let progressInterval = null;
  let progressValue = 0;
  let activeRequestsCount = 0;
  let safetyTimeout = null;
  let currentActiveButton = null;

  const AppLoader = {
    // 1. Progress Bar Logic
    startProgress: function () {
      if (!progressBar) return;
      window.clearInterval(progressInterval);
      progressBar.classList.remove('is-done');
      progressBar.classList.add('is-active');
      progressValue = 15;
      progressBar.style.width = progressValue + '%';

      progressInterval = window.setInterval(function () {
        if (progressValue < 60) {
          progressValue += 10;
        } else if (progressValue < 85) {
          progressValue += 3;
        } else if (progressValue < 95) {
          progressValue += 0.5;
        }
        progressBar.style.width = progressValue + '%';
      }, 150);
    },

    finishProgress: function () {
      if (!progressBar) return;
      window.clearInterval(progressInterval);
      progressValue = 100;
      progressBar.style.width = '100%';
      progressBar.classList.add('is-done');
      setTimeout(function () {
        progressBar.classList.remove('is-active');
        progressBar.style.width = '0%';
      }, 350);
    },

    // 2. Action Overlay Spinner Logic
    showActionOverlay: function (title, desc) {
      if (!actionOverlay) return;
      if (titleEl) titleEl.textContent = title || 'Memproses Data';
      if (descTextEl) descTextEl.textContent = desc || 'Mohon tunggu sebentar';
      actionOverlay.classList.add('is-visible');
    },

    hideActionOverlay: function () {
      if (!actionOverlay) return;
      actionOverlay.classList.remove('is-visible');
    },

    // 3. Unified Master Controller
    start: function (options) {
      options = options || {};
      activeRequestsCount++;

      // Always run top progress bar
      this.startProgress();

      // Show full glassmorphic spinner card if requested or on modal/form/delete
      if (options.overlay !== false && (options.overlay === true || options.title)) {
        this.showActionOverlay(options.title, options.desc);
      }

      // Reset safety timeout (15s safeguard)
      window.clearTimeout(safetyTimeout);
      safetyTimeout = window.setTimeout(function () {
        AppLoader.forceReset();
      }, 15000);
    },

    done: function () {
      activeRequestsCount = Math.max(0, activeRequestsCount - 1);
      if (activeRequestsCount === 0) {
        this.finishProgress();
        this.hideActionOverlay();
        if (currentActiveButton) {
          currentActiveButton.classList.remove('is-btn-loading');
          currentActiveButton = null;
        }
        document.querySelectorAll('.is-btn-loading').forEach(function (btn) {
          btn.classList.remove('is-btn-loading');
        });
        window.clearTimeout(safetyTimeout);
      }
    },

    forceReset: function () {
      activeRequestsCount = 0;
      this.finishProgress();
      this.hideActionOverlay();
      document.querySelectorAll('.is-btn-loading').forEach(function (btn) {
        btn.classList.remove('is-btn-loading');
      });
      window.clearTimeout(safetyTimeout);
    }
  };

  window.AppLoader = AppLoader;

  // 4. Deteksi Konteks & Pesan Animasi Otomatis
  function detectActionContext(elt) {
    if (!elt) {
      return { overlay: false, title: null, desc: null };
    }

    const form = elt.closest('form');
    const isDeleteModal = elt.closest('.modal-content') && elt.closest('.modal-content').querySelector('.modal-title.text-danger');
    const isSubmitBtn = (elt.type === 'submit') || elt.closest('button[type="submit"]') || (elt.tagName === 'FORM');
    const hxGet = elt.getAttribute('hx-get') || '';
    const hxPost = elt.getAttribute('hx-post') || (form ? form.getAttribute('hx-post') : '');
    const url = hxGet || hxPost || (form ? form.action : '');
    const btnText = (elt.textContent || '').trim().toLowerCase();

    // A. Aksi Penghapusan
    if (url.includes('/delete/') || btnText.includes('hapus') || isDeleteModal) {
      if (isSubmitBtn || hxPost) {
        return {
          overlay: true,
          title: 'Menghapus Data',
          desc: 'Sistem sedang menghapus data terpilih'
        };
      }
      return {
        overlay: true,
        title: 'Menyiapkan Penghapusan',
        desc: 'Memuat data konfirmasi'
      };
    }

    // B. Aksi Simpan / Tambah / Update Form
    if (isSubmitBtn && (url.includes('/form/') || url.includes('/update/') || form)) {
      return {
        overlay: true,
        title: 'Menyimpan Perubahan',
        desc: 'Data sedang divalidasi dan disimpan ke server'
      };
    }

    // C. Membuka Form Tambah / Edit Modal
    if (hxGet && (hxGet.includes('/form/') || hxGet.includes('/update/') || hxGet.includes('/add/'))) {
      const isEdit = hxGet.includes('/update/') || btnText.includes('edit');
      return {
        overlay: true,
        title: isEdit ? 'Memuat Formulir Edit' : 'Menyiapkan Formulir',
        desc: 'Mengambil data dari server'
      };
    }

    // D. Preview Dokumen Cetak (SPT, SPD, Kwitansi, Laporan Perjalanan)
    if (hxGet && hxGet.includes('/preview/')) {
      if (hxGet.includes('/kwitansi/')) {
        return {
          overlay: true,
          title: 'Memuat Kwitansi',
          desc: 'Menyiapkan pratinjau cetak kwitansi'
        };
      }
      if (hxGet.includes('/spt/')) {
        return {
          overlay: true,
          title: 'Memuat SPT',
          desc: 'Menyiapkan pratinjau Surat Perintah Tugas'
        };
      }
      if (hxGet.includes('/spd/')) {
        return {
          overlay: true,
          title: 'Memuat SPD',
          desc: 'Menyiapkan pratinjau Surat Perjalanan Dinas'
        };
      }
      return {
        overlay: true,
        title: 'Memuat Pratinjau',
        desc: 'Menyiapkan pratinjau dokumen cetak'
      };
    }

    // E. Ekspor Excel / PDF / Cetak Langsung
    if (btnText.includes('excel') || btnText.includes('cetak') || url.includes('/excel/') || url.includes('/pdf/')) {
      return {
        overlay: true,
        title: 'Menyiapkan Berkas',
        desc: 'Memproses format dokumen'
      };
    }

    // F. Aksi tabel biasa (Paginasi, sorting, live search) -> Cukup top progress bar halus
    return { overlay: false, title: null, desc: null };
  }

  // 5. Integrasi Otomatis dengan HTMX Events
  document.addEventListener('htmx:beforeRequest', function (evt) {
    const elt = evt.detail.elt;
    const context = detectActionContext(elt);

    // Tandai button dengan micro-spinner
    const btn = elt ? elt.closest('button, .btn') : null;
    if (btn && (context.overlay || btn.type === 'submit')) {
      btn.classList.add('is-btn-loading');
      currentActiveButton = btn;
    }

    AppLoader.start(context);
  });

  document.addEventListener('htmx:afterRequest', function () {
    AppLoader.done();
  });

  document.addEventListener('htmx:sendError', function () {
    AppLoader.forceReset();
  });

  document.addEventListener('htmx:responseError', function () {
    AppLoader.forceReset();
  });

  // 6. Integrasi dengan Standard Form Submission (Non-HTMX)
  document.addEventListener('submit', function (evt) {
    const form = evt.target;
    if (form && !form.hasAttribute('hx-post') && !form.hasAttribute('hx-get')) {
      // Skip jika form sudah ditangani oleh handler halaman spesifik
      if (form.getAttribute('data-loader-handled')) return;
      const submitter = evt.submitter;
      const exportVal = submitter ? (submitter.value || '') : '';
      if (submitter) submitter.classList.add('is-btn-loading');
      if (exportVal === 'excel') {
        AppLoader.start({ overlay: true, title: 'Menyiapkan Excel', desc: 'Memproses data ke format spreadsheet' });
        // File download: reset setelah 8 detik
        setTimeout(function () { AppLoader.forceReset(); }, 8000);
      } else if (exportVal === 'pdf') {
        AppLoader.start({ overlay: true, title: 'Menyiapkan PDF', desc: 'Memproses data ke format dokumen' });
        setTimeout(function () { AppLoader.forceReset(); }, 8000);
      } else {
        AppLoader.start({ overlay: true, title: 'Menyimpan Data', desc: 'Mengirimkan formulir ke server' });
      }
    }
  }, true);

  // 7. Cleanup otomatis saat modal ditutup
  document.addEventListener('hidden.bs.modal', function () {
    AppLoader.hideActionOverlay();
    document.querySelectorAll('.is-btn-loading').forEach(function (btn) {
      btn.classList.remove('is-btn-loading');
    });
  });

  // 8. Spinner cerdas untuk SEMUA navigasi link <a> (non-HTMX full-page navigation)
  //    - Spinner hanya muncul jika koneksi/server membutuhkan waktu (delay 300ms)
  //    - Dibatalkan otomatis jika halaman dimuat cepat (di bawah 300ms)

  var navSpinnerTimer = null;
  var navSpinnerAnchor = null;

  // Pesan spinner berdasarkan URL — fallback ke pesan generik
  function getNavLoaderOptions(href) {
    if (!href || href.startsWith('#') || href.startsWith('javascript')) return null;

    // Khusus laporan & dokumen berat
    if (href.includes('/laporan-perjalanan/cetak/') || href.includes('/laporan-perjalanan/preview/')) {
      return { overlay: true, title: 'Memuat Dokumen Laporan', desc: 'Menyiapkan dokumen perjalanan dinas' };
    }
    if (href.includes('/laporan-perjalanan/')) {
      return { overlay: true, title: 'Memuat Laporan Perjalanan', desc: 'Mengambil data laporan dari server' };
    }
    if (href.includes('/data-perjalanan-per-orang/')) {
      return { overlay: true, title: 'Memuat Data Perjalanan', desc: 'Mengambil data perjalanan per pegawai' };
    }
    if (href.includes('/laporan/') || href.endsWith('/laporan')) {
      return { overlay: true, title: 'Memuat Rekap SPJ', desc: 'Mengambil data rekap seluruh SPJ dari server' };
    }
    if (href.includes('/kwitansi/')) {
      return { overlay: true, title: 'Memuat Kwitansi', desc: 'Menyiapkan data kwitansi' };
    }

    // Halaman umum — pesan generik, cukup progress bar + overlay ringan
    return { overlay: true, title: 'Memuat Halaman', desc: 'Mengambil data dari server' };
  }

  // Batalkan spinner nav yang belum sempat muncul (navigasi cepat / bfcache)
  function cancelNavSpinner() {
    if (navSpinnerTimer) {
      window.clearTimeout(navSpinnerTimer);
      navSpinnerTimer = null;
    }
    if (navSpinnerAnchor) {
      navSpinnerAnchor.classList.remove('is-btn-loading');
      navSpinnerAnchor.classList.remove('is-sidebar-loading');
      navSpinnerAnchor = null;
    }
    document.querySelectorAll('.is-sidebar-loading').forEach(function (el) {
      el.classList.remove('is-sidebar-loading');
    });
  }

  document.addEventListener('click', function (evt) {
    var anchor = evt.target.closest('a[href]');
    if (!anchor) return;

    // Abaikan jika modifier keys ditekan (Ctrl/Cmd/Shift/Alt click untuk buka di tab baru)
    if (evt.ctrlKey || evt.metaKey || evt.shiftKey || evt.altKey || evt.button !== 0) return;

    // Skip HTMX-handled links, javascript:, # links, download links, external links, disabled links
    if (anchor.hasAttribute('hx-get') || anchor.hasAttribute('hx-post')) return;
    if (anchor.classList.contains('disabled') || anchor.getAttribute('aria-disabled') === 'true') return;
    var href = anchor.getAttribute('href') || '';
    if (!href || href === '#' || href.startsWith('#') || href.startsWith('javascript')) return;
    if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('//')) return;
    if (anchor.hasAttribute('download') || anchor.getAttribute('target') === '_blank') return;

    var isSidebarLink = !!anchor.closest('.pc-sidebar');
    var isSubmenuLink = !!anchor.closest('.pc-sidebar .pc-submenu');

    var opts = getNavLoaderOptions(href);
    if (!opts && !isSidebarLink) return;

    // Bersihkan spinner aktif sebelumnya jika ada
    cancelNavSpinner();
    navSpinnerAnchor = anchor;

    // Selalu mulai top progress bar segera
    AppLoader.startProgress();

    // JIKA DIKLIK DARI SUBMENU SIDEBAR (atau link navigasi sidebar):
    if (isSubmenuLink || isSidebarLink) {
      anchor.classList.add('is-sidebar-loading');

      // Ambil nama submenu untuk ditampilkan pada judul loader
      var label = (anchor.querySelector('.pc-mtext')?.textContent || anchor.textContent || '').trim();
      label = label.replace(/\s+/g, ' ');

      var title = label ? ('Memuat ' + label) : (opts ? opts.title : 'Memuat Halaman');
      var desc = 'Mengambil data dari server, mohon tunggu sebentar...';

      // Efek visual redup pada container konten utama agar jelas sedang proses muat
      var mainContainer = document.querySelector('.pc-container') || document.getElementById('main-content');
      if (mainContainer) {
        mainContainer.style.transition = 'opacity 0.25s ease';
        mainContainer.style.opacity = '0.45';
        mainContainer.style.pointerEvents = 'none';
      }

      // Tutup menu drawer mobile di HP jika sedang terbuka
      if (typeof remove_menu === 'function' && document.querySelector('.pc-sidebar.mob-sidebar-active')) {
        setTimeout(function () {
          remove_menu();
        }, 120);
      }

      // TAMPILKAN SPINNER OVERLAY LANGSUNG (0ms delay)
      AppLoader.showActionOverlay(title, desc);
      return;
    }

    // Untuk link navigasi umum lainnya di luar sidebar (delay 300ms)
    anchor.classList.add('is-btn-loading');
    navSpinnerTimer = window.setTimeout(function () {
      navSpinnerTimer = null;
      AppLoader.showActionOverlay(opts.title, opts.desc);
    }, 300);
  });

  // Bersihkan spinner ketika halaman sudah selesai dimuat
  window.addEventListener('pageshow', function (evt) {
    cancelNavSpinner();
    AppLoader.forceReset();
    var mainContainer = document.querySelector('.pc-container') || document.getElementById('main-content');
    if (mainContainer) {
      mainContainer.style.opacity = '';
      mainContainer.style.pointerEvents = '';
    }
  });

  // Bersihkan spinner saat user menekan tombol Back/Forward browser
  window.addEventListener('popstate', function () {
    cancelNavSpinner();
    AppLoader.forceReset();
    var mainContainer = document.querySelector('.pc-container') || document.getElementById('main-content');
    if (mainContainer) {
      mainContainer.style.opacity = '';
      mainContainer.style.pointerEvents = '';
    }
  });
})();
</script>
