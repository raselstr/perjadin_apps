<script>
(function () {
  if (window.__imageUploadCompressorReady) {
    return;
  }
  window.__imageUploadCompressorReady = true;

  const MAX_EDGE = 1024;
  const JPEG_QUALITY = 0.82;
  const MIN_SIZE_TO_COMPRESS = 700 * 1024;
  const IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

  function shouldHandleInput(input) {
    if (!input || input.type !== 'file' || !input.files || !input.files.length) {
      return false;
    }

    const accept = input.getAttribute('accept') || '';
    return accept.includes('image') || Array.from(input.files).some(function (file) {
      return file.type && file.type.startsWith('image/');
    });
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      const image = new Image();
      const url = URL.createObjectURL(file);
      image.onload = function () {
        URL.revokeObjectURL(url);
        resolve(image);
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Gagal membaca foto.'));
      };
      image.src = url;
    });
  }

  function canvasToBlob(canvas) {
    const isMobile =
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isMobile) {
        return file;
    }
    return new Promise(function (resolve) {
      canvas.toBlob(resolve, 'image/jpeg', JPEG_QUALITY);
    });
  }

  async function compressFile(file) {
    if (!file || !IMAGE_TYPES.includes(file.type)) {
      return file;
    }

    const image = await loadImage(file);
    const scale = Math.min(1, MAX_EDGE / Math.max(image.width, image.height));

    if (scale >= 1 && file.size < MIN_SIZE_TO_COMPRESS) {
      return file;
    }

    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.width * scale));
    canvas.height = Math.max(1, Math.round(image.height * scale));
    const context = canvas.getContext('2d');
    context.drawImage(image, 0, 0, canvas.width, canvas.height);

    const blob = await canvasToBlob(canvas);
    if (!blob || blob.size >= file.size) {
      return file;
    }

    const name = (file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg';
    return new File([blob], name, {
      type: 'image/jpeg',
      lastModified: Date.now(),
    });
  }

  async function compressInputFiles(input) {
    if (!shouldHandleInput(input) || input.dataset.compressingImage === '1') {
      return;
    }

    if (typeof DataTransfer === 'undefined') {
      return;
    }

    input.dataset.compressingImage = '1';
    const originalFiles = Array.from(input.files);
    const transfer = new DataTransfer();

    try {
      for (const file of originalFiles) {
        try {
          transfer.items.add(await compressFile(file));
        } catch (error) {
          console.warn('Kompresi foto browser gagal, memakai file asli.', error);
          transfer.items.add(file);
        }
      }

      input.files = transfer.files;
    } finally {
      input.dataset.compressingImage = '0';
    }
  }

  document.addEventListener('change', function (event) {
    if (event.target && event.target.type === 'file') {
      compressInputFiles(event.target);
    }
  });
})();
</script>
