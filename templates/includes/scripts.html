{% load static %}

<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<!-- Select2 CSS -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />

<!-- jQuery (WAJIB untuk Select2) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 JS -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="{% static 'assets/js/plugins/popper.min.js' %}"></script>
<script src="{% static 'assets/js/plugins/simplebar.min.js' %}"></script>
<script src="{% static 'assets/js/plugins/bootstrap.min.js' %}"></script>
<script src="{% static 'assets/js/config.js' %}"></script>
<script src="{% static 'assets/js/pcoded.js' %}"></script>
<script src="{% static 'assets/js/layoutTheme.js' %}"></script>

<script>
(function () {
  if (window.__imageUploadCompressorReady) {
    return;
  }
  window.__imageUploadCompressorReady = true;

  const MAX_EDGE = 800;
  const JPEG_QUALITY = 0.78;
  const MIN_SIZE_TO_COMPRESS = 250 * 1024;
  const IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
  const ALLOWED_PHOTO_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp'];
  const MOBILE_USER_AGENT = /Android|iPhone|iPad|iPod/i;

  function shouldHandleInput(input) {
    if (!input || input.type !== 'file' || !input.files || !input.files.length) {
      return false;
    }

    const accept = input.getAttribute('accept') || '';
    return accept.includes('image') || Array.from(input.files).some(function (file) {
      return file.type && file.type.startsWith('image/');
    });
  }

  function isMobileBrowser() {
    return MOBILE_USER_AGENT.test(navigator.userAgent || '');
  }

  function isCameraInput(input) {
    return input && input.hasAttribute('data-spj-camera-source');
  }

  function shouldCompressInBrowser(input) {
    if (!shouldHandleInput(input)) {
      return false;
    }

    if (isMobileBrowser() || isCameraInput(input)) {
      return false;
    }

    return true;
  }

  function getPhotoWrapper(input) {
    return input.closest('[data-spj-photo-field="1"]');
  }

  function setPhotoStatus(input, message, tone) {
    const wrapper = getPhotoWrapper(input);
    const status = wrapper ? wrapper.querySelector('[data-spj-photo-status]') : null;
    if (!status) {
      return;
    }

    status.textContent = message || '';
    status.classList.toggle('text-danger', tone === 'danger');
    status.classList.toggle('text-success', tone === 'success');
    status.classList.toggle('text-muted', !tone);
  }

  function getFileExtension(file) {
    const name = (file && file.name ? file.name : '').toLowerCase();
    const parts = name.split('.');
    return parts.length > 1 ? parts.pop() : '';
  }

  function validatePhotoInput(input) {
    if (!input || input.type !== 'file' || !input.files || !input.files.length) {
      return true;
    }

    const file = input.files[0];
    const extension = getFileExtension(file);
    const contentType = (file.type || '').toLowerCase();
    const source = input.hasAttribute('data-spj-camera-source') ? 'kamera' : 'galeri';

    if (!file.size) {
      setPhotoStatus(
        input,
        'Foto tidak terbaca. Aktifkan izin Kamera dan Foto/File untuk browser, lalu pilih atau ambil foto lagi.',
        'danger'
      );
      input.value = '';
      return false;
    }

    if (extension === 'heic' || extension === 'heif' || contentType === 'image/heic' || contentType === 'image/heif') {
      setPhotoStatus(
        input,
        'Foto kamera memakai HEIC/HEIF. Di Redmi/Xiaomi buka Kamera > Setelan, nonaktifkan HEIF/High efficiency atau pilih format JPG/JPEG, lalu ambil foto ulang.',
        'danger'
      );
      input.value = '';
      return false;
    }

    if (extension && !ALLOWED_PHOTO_EXTENSIONS.includes(extension)) {
      setPhotoStatus(
        input,
        'Format foto belum didukung. Gunakan JPG, JPEG, PNG, atau WEBP.',
        'danger'
      );
      input.value = '';
      return false;
    }

    if (contentType && !contentType.startsWith('image/')) {
      setPhotoStatus(input, 'File yang dipilih bukan foto. Pilih file gambar.', 'danger');
      input.value = '';
      return false;
    }

    setPhotoStatus(input, (file.name || 'Foto') + ' siap dari ' + source + '.', 'success');
    return true;
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      const image = new Image();
      const url = URL.createObjectURL(file);
      image.onload = function () {
        URL.revokeObjectURL(url);
        resolve(image);
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Gagal membaca foto.'));
      };
      image.src = url;
    });
  }

  function canvasToBlob(canvas) {
    return new Promise(function (resolve) {
      canvas.toBlob(resolve, 'image/jpeg', JPEG_QUALITY);
    });
  }

  async function compressFile(file) {
    if (!file || !IMAGE_TYPES.includes(file.type)) {
      return file;
    }

    const image = await loadImage(file);
    const scale = Math.min(1, MAX_EDGE / Math.max(image.width, image.height));

    if (scale >= 1 && file.size < MIN_SIZE_TO_COMPRESS) {
      return file;
    }

    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.width * scale));
    canvas.height = Math.max(1, Math.round(image.height * scale));
    const context = canvas.getContext('2d');
    context.drawImage(image, 0, 0, canvas.width, canvas.height);

    const blob = await canvasToBlob(canvas);
    if (!blob || blob.size >= file.size) {
      return file;
    }

    const name = (file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg';
    return new File([blob], name, {
      type: 'image/jpeg',
      lastModified: Date.now(),
    });
  }

  async function compressInputFiles(input) {
    if (!shouldCompressInBrowser(input) || input.dataset.compressingImage === '1') {
      return;
    }

    if (typeof DataTransfer === 'undefined') {
      return;
    }

    input.dataset.compressingImage = '1';
    const originalFiles = Array.from(input.files);
    const transfer = new DataTransfer();

    try {
      for (const file of originalFiles) {
        try {
          transfer.items.add(await compressFile(file));
        } catch (error) {
          console.warn('Kompresi foto browser gagal, memakai file asli.', error);
          transfer.items.add(file);
        }
      }

      input.files = transfer.files;
    } finally {
      input.dataset.compressingImage = '0';
    }
  }

  document.addEventListener('change', function (event) {
    if (event.target && event.target.type === 'file') {
      if (validatePhotoInput(event.target)) {
        compressInputFiles(event.target);
      }
    }
  });

  document.addEventListener('submit', async function (event) {
    const form = event.target;

    if (!form || form.dataset.imageCompressionSubmitReady === '1') {
      return;
    }

    const inputs = Array.from(form.querySelectorAll('input[type="file"]'))
      .filter(shouldHandleInput);

    if (!inputs.length) {
      return;
    }

    if (!inputs.every(validatePhotoInput)) {
      event.preventDefault();
      return;
    }

    event.preventDefault();
    form.dataset.imageCompressionSubmitReady = '1';

    try {
      await Promise.all(inputs.map(compressInputFiles));
    } finally {
      if (window.htmx && form.hasAttribute('hx-post')) {
        window.htmx.trigger(form, 'submit');
      } else if (form.requestSubmit) {
        form.requestSubmit();
      } else {
        form.submit();
      }
    }
  }, true);

  function initializePhotoChoiceFields(scope) {
    const root = scope || document;
    root.querySelectorAll('[data-spj-photo-field="1"]').forEach(function (wrapper) {
      if (wrapper.dataset.photoChoiceReady === '1') {
        return;
      }
      wrapper.dataset.photoChoiceReady = '1';

      const inputs = Array.from(wrapper.querySelectorAll('input[type="file"]'));
      inputs.forEach(function (input) {
        input.addEventListener('change', function () {
          if (input.files && input.files.length) {
            inputs.forEach(function (otherInput) {
              if (otherInput !== input) {
                otherInput.value = '';
              }
            });
          }
          validatePhotoInput(input);
        });
      });

      wrapper.querySelectorAll('label[for]').forEach(function (label) {
        label.addEventListener('click', function () {
          const target = document.getElementById(label.getAttribute('for'));
          const usingCamera = target && target.hasAttribute('data-spj-camera-source');
          setPhotoStatus(
            target || inputs[0],
            usingCamera
              ? 'Membuka kamera HP. Jika tidak muncul, aktifkan izin Kamera untuk browser.'
              : 'Membuka galeri HP. Jika tidak muncul, aktifkan izin Foto/File untuk browser.',
            null
          );
        });
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      initializePhotoChoiceFields(document);
    });
  } else {
    initializePhotoChoiceFields(document);
  }

  document.body.addEventListener('htmx:afterSwap', function (event) {
    initializePhotoChoiceFields(event.detail && event.detail.target ? event.detail.target : document);
  });
})();
</script>
